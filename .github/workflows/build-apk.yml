name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Kumpulkan file web ke folder www
        run: |
          mkdir www
          cp index.html manifest.json service-worker.js www/
          cp -r fonts www/fonts
          cp -r icons www/icons
          cp -r vendor www/vendor

      - name: Init Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Jadwal BT" "com.hannezt19.jadwalbt" --web-dir=www
          npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK (debug, unsigned)
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jadwal-bt-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
