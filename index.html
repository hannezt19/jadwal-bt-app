<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Jadwal BT</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7A4A00">
<script src="vendor/jspdf.umd.min.js"></script>
<script>
  if (!window.jspdf) {
    var _jspdfFallback = document.createElement('script');
    _jspdfFallback.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js';
    document.head.appendChild(_jspdfFallback);
  }
</script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#8A5A00; --on-primary:#FFFFFF; --primary-container:#FFDDAE; --on-primary-container:#2B1700;
  --secondary:#5C5240; --secondary-container:#E6DCC6;
  --success:#2E7D32; --success-container:#D7ECD9;
  --danger:#B3261E; --danger-container:#F9DEDC;
  --surface:#FFF8F3; --surface-container:#F3E8DA; --surface-container-high:#ECDFCB; --surface-container-low:#F8EFE4;
  --on-surface:#1F1B13; --on-surface-variant:#4E4636;
  --outline:#D6C6AC; --outline-variant:#E8DCC8;
  --navy:#1C2333;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--surface);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--on-surface);}
button,input,select,textarea{font-family:inherit;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
#topbar{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top, 24px)) 16px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
#topbar .hbtn{background:none;border:none;color:#fff;font-size:22px;padding:6px;cursor:pointer;line-height:1;}
#topbar .titles{flex:1;min-width:0;}
#topbar .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#D8CBE8;font-weight:700;}
#topbar .titlemain{font-size:16px;font-weight:800;margin-top:2px;}
#topbar .badge{background:var(--primary-container);color:var(--on-primary-container);font-size:12px;font-weight:700;padding:6px 12px;border-radius:100px;white-space:nowrap;}
#screens{flex:1;overflow-y:auto;padding:16px 16px 100px;}
.screen{display:none;}
.screen.active{display:block;}
#bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;justify-content:space-around;padding:8px 4px calc(10px + env(safe-area-inset-bottom, 20px));z-index:40;}
#bottomnav button{background:none;border:none;color:#9AA0B4;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 10px;border-radius:16px;cursor:pointer;}
#bottomnav button svg{width:22px;height:22px;}
#bottomnav button.active{color:var(--primary-container);background:rgba(255,255,255,.08);}

.section-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface-variant);font-weight:700;margin:18px 0 8px;}
.section-eyebrow:first-child{margin-top:0;}
.section-eyebrow-row{display:flex;justify-content:space-between;align-items:center;}
.card{background:#fff;border:1px solid var(--outline-variant);border-radius:20px;padding:16px;margin-bottom:14px;}
.card-flat{background:var(--surface-container);border:none;}

input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;border:1.5px solid var(--outline);border-radius:14px;padding:12px;font-size:16px;min-height:48px;
  background:var(--surface-container-low);color:var(--on-surface);margin-bottom:12px;
}
input.field-error{border-color:var(--danger)!important;background:var(--danger-container);}
textarea{resize:vertical;min-height:48px;}
label.flabel{display:block;font-size:12px;font-weight:700;color:var(--on-surface-variant);margin-bottom:4px;}
.field-sub{font-size:12px;color:var(--on-surface-variant);}
.grid2{display:grid;grid-template-columns:1fr;gap:8px 12px;}
.grid2 .full{grid-column:1/-1;}
@media (min-width:400px){ .grid2{grid-template-columns:1fr 1fr;} }

.pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:var(--on-primary);border:none;border-radius:100px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;}
.pill-btn.outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
.pill-btn.sm{padding:7px 12px;font-size:12px;}
.btn-block{display:block;width:100%;text-align:center;background:var(--primary);color:var(--on-primary);border:none;border-radius:16px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;}
.btn-block.outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-container);border:1.5px solid var(--outline);border-radius:100px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--on-surface);}
.chip.active{background:var(--primary-container);border-color:var(--primary-container);color:var(--on-primary-container);}
.chk-row{display:flex;align-items:center;padding:8px 0;font-size:14px;}
.chk-row input[type=radio]{width:auto;min-height:auto;margin:0;}

/* Drawer (hamburger) */
#drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;}
#drawerOverlay.show{display:block;}
#drawer{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:320px;background:#fff;z-index:61;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;}
#drawer.show{transform:translateX(0);}
#drawer .dhead{background:var(--navy);color:#fff;padding:24px 20px;}
#drawer .dhead .name{font-size:18px;font-weight:800;}
#drawer .dhead .sub{font-size:12px;color:#B9C0D6;margin-top:2px;}
#drawer .ditem{display:flex;align-items:center;gap:14px;padding:14px 20px;font-size:15px;font-weight:600;color:var(--on-surface);cursor:pointer;border-bottom:1px solid var(--outline-variant);}
#drawer .ditem .ic{width:22px;text-align:center;}
#drawer .dgroup{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant);font-weight:700;padding:16px 20px 4px;}

/* Modal sheet */
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:none;align-items:flex-end;}
#modalOverlay.show{display:flex;}
#modalSheet{background:var(--surface);width:100%;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px;}
#modalSheet .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
#modalSheet .mhead h2{font-size:18px;margin:0;font-weight:800;}
#modalSheet .mclose{background:var(--surface-container);border:none;border-radius:100px;width:36px;height:36px;font-size:18px;cursor:pointer;}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:100px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:90;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.empty-note{text-align:center;color:var(--on-surface-variant);padding:24px 12px;font-size:13px;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--outline-variant);}
.list-row:last-child{border-bottom:none;}
.icon-btn{background:none;border:none;font-size:16px;padding:6px;cursor:pointer;color:var(--on-surface-variant);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="hbtn" onclick="openDrawer()">&#9776;</button>
    <div class="titles">
      <div class="eyebrow" id="tb-eyebrow">BERANDA</div>
      <div class="titlemain" id="tb-title">Ringkasan</div>
    </div>
    <div class="badge" id="tb-badge">-</div>
  </div>

  <div id="screens">
    <div class="screen active" id="screen-beranda"></div>
    <div class="screen" id="screen-hari"></div>
    <div class="screen" id="screen-peta"></div>
    <div class="screen" id="screen-rekap"></div>
  </div>

  <nav id="bottomnav">
    <button data-tab="beranda" onclick="showScreen('beranda')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Beranda</span>
    </button>
    <button data-tab="hari" onclick="showScreen('hari')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
      <span>Hari Ini</span>
    </button>
    <button data-tab="peta" onclick="showScreen('peta')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>
      <span>Peta</span>
    </button>
    <button data-tab="rekap" onclick="showScreen('rekap')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span>Rekap</span>
    </button>
  </nav>
</div>

<div id="drawerOverlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="dhead">
    <div class="name" id="dw-name">Nama belum diisi</div>
    <div class="sub" id="dw-unit">Unit default: -</div>
  </div>
  <div class="dgroup">Akun</div>
  <div class="ditem" onclick="openSettingAkun()"><span class="ic">&#9881;</span> Pengaturan Akun</div>
  <div class="dgroup">Master Data</div>
  <div class="ditem" onclick="openKelolaUnit()"><span class="ic">&#128666;</span> No Unit</div>
  <div class="ditem" onclick="openKelolaBlok()"><span class="ic">&#128506;</span> No Blok</div>
  <div class="dgroup">Servis</div>
  <div class="ditem" onclick="openServisModal()"><span class="ic">&#128295;</span> Riwayat &amp; Catat Servis</div>
  <div class="ditem" onclick="openGantiHmModal()"><span class="ic">&#128260;</span> Ganti HM Manual</div>
</div>

<div id="modalOverlay"><div id="modalSheet"></div></div>
<div id="toast"></div>

<script>
/* ================= DATA LAYER ================= */
const LS = {
  get(key, def){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
};
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtLabel(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jumat",'Sabtu'][d.getDay()];
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()];
  return hari+', '+d.getDate()+' '+bulan+' '+d.getFullYear();
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('show'),2200); }

let USER = LS.get('v2_user', {name:'', mainBt:''});
let UNITS = LS.get('v2_units', []);       // [{id, kode}]
let BLOKS = LS.get('v2_bloks', []);       // [{id, kode}]
let ENTRIES = LS.get('v2_entries', []);   // daily log entries
let SERVIS = LS.get('v2_servis', []);     // [{id, btId, date, hm, note}]
let HM_RESETS = LS.get('v2_hmresets', []); // [{id, btId, date, note}]
let SETTINGS = LS.get('v2_settings', {serviceInterval:240});
function saveUser(){ LS.set('v2_user', USER); }
function saveUnits(){ LS.set('v2_units', UNITS); }
function saveBloks(){ LS.set('v2_bloks', BLOKS); }
function saveEntries(){ LS.set('v2_entries', ENTRIES); }
function saveServis(){ LS.set('v2_servis', SERVIS); }
function saveHmResets(){ LS.set('v2_hmresets', HM_RESETS); }
function saveSettings(){ LS.set('v2_settings', SETTINGS); }

/* ================= NAVIGATION ================= */
const TITLES = {
  beranda:['BERANDA', 'Ringkasan'],
  hari:['HARI INI', ()=>fmtLabel(todayIso())],
  peta:['PETA', 'Lokasi Kerja'],
  rekap:['REKAP', 'Riwayat & Laporan']
};
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('#bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  const t = TITLES[name];
  document.getElementById('tb-eyebrow').textContent = t[0];
  document.getElementById('tb-title').textContent = typeof t[1]==='function' ? t[1]() : t[1];
  document.getElementById('tb-badge').textContent = USER.mainBt ? btLabel(USER.mainBt) : '-';
  if(name==='beranda') renderBeranda();
  if(name==='hari') renderHari();
  if(name==='rekap') renderRekap();
  if(name==='peta') renderPeta();
}
function btLabel(id){ const u = UNITS.find(x=>x.id===id); return u ? u.kode : '-'; }

/* ================= DRAWER ================= */
function openDrawer(){
  document.getElementById('dw-name').textContent = USER.name || 'Nama belum diisi';
  document.getElementById('dw-unit').textContent = 'Unit default: '+(USER.mainBt ? btLabel(USER.mainBt) : '-');
  document.getElementById('drawerOverlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}

/* ================= MODAL HELPER ================= */
function openModal(html){
  document.getElementById('modalSheet').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }

/* ================= PENGATURAN AKUN ================= */
function openSettingAkun(){
  closeDrawer();
  openModal(`
    <div class="mhead"><h2>Pengaturan Akun</h2><button class="mclose" onclick="closeModal()">&times;</button></div>
    <label class="flabel">Nama Kamu</label>
    <input type="text" id="setNama" value="${escapeHtml(USER.name)}" placeholder="mis. Yohanes">
    <label class="flabel">Unit Default</label>
    <select id="setUnit">
      <option value="">- Pilih unit -</option>
      ${UNITS.map(u=>`<option value="${u.id}" ${USER.mainBt===u.id?'selected':''}>${escapeHtml(u.kode)}</option>`).join('')}
    </select>
    <button class="btn-block" onclick="saveSettingAkun()">Simpan</button>
  `);
}
function saveSettingAkun(){
  USER.name = document.getElementById('setNama').value.trim();
  USER.mainBt = document.getElementById('setUnit').value;
  saveUser();
  closeModal();
  toast('Pengaturan akun disimpan');
  showScreen(document.querySelector('#bottomnav button.active').dataset.tab);
}

/* ================= KELOLA UNIT ================= */
function openKelolaUnit(){
  closeDrawer();
  renderKelolaUnitModal();
}
function renderKelolaUnitModal(){
  openModal(`
    <div class="mhead"><h2>Kelola No Unit</h2><button class="mclose" onclick="closeModal()">&times;</button></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input type="text" id="newUnitKode" placeholder="mis. BT.14" style="margin-bottom:0;">
      <button class="pill-btn" onclick="addUnit()">+ Tambah</button>
    </div>
    <div class="card card-flat">
      ${UNITS.length===0 ? '<div class="empty-note">Belum ada unit. Tambahkan di atas.</div>' :
        UNITS.map(u=>`<div class="list-row"><span>${escapeHtml(u.kode)}</span><button class="icon-btn" onclick="deleteUnit('${u.id}')">&#128465;</button></div>`).join('')}
    </div>
  `);
}
function addUnit(){
  const val = document.getElementById('newUnitKode').value.trim();
  if(!val){ toast('Isi nomor unit dulu'); return; }
  if(UNITS.some(u=>u.kode.toLowerCase()===val.toLowerCase())){ toast('Unit ini sudah ada'); return; }
  UNITS.push({id:uid(), kode:val});
  saveUnits();
  renderKelolaUnitModal();
  toast('Unit ditambahkan');
}
function deleteUnit(id){
  if(!confirm('Hapus unit ini? Data entri lama yang memakai unit ini tidak akan terhapus, tapi labelnya akan hilang.')) return;
  UNITS = UNITS.filter(u=>u.id!==id);
  saveUnits();
  renderKelolaUnitModal();
  toast('Unit dihapus');
}

/* ================= KELOLA BLOK ================= */
function openKelolaBlok(){
  closeDrawer();
  renderKelolaBlokModal();
}
function renderKelolaBlokModal(){
  openModal(`
    <div class="mhead"><h2>Kelola No Blok</h2><button class="mclose" onclick="closeModal()">&times;</button></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input type="text" id="newBlokKode" placeholder="mis. BU 30" style="margin-bottom:0;">
      <button class="pill-btn" onclick="addBlok()">+ Tambah</button>
    </div>
    <div class="card card-flat">
      ${BLOKS.length===0 ? '<div class="empty-note">Belum ada blok. Tambahkan di atas.</div>' :
        BLOKS.map(b=>`<div class="list-row"><span>${escapeHtml(b.kode)}</span><button class="icon-btn" onclick="deleteBlok('${b.id}')">&#128465;</button></div>`).join('')}
    </div>
  `);
}
function addBlok(){
  const val = document.getElementById('newBlokKode').value.trim();
  if(!val){ toast('Isi nomor blok dulu'); return; }
  if(BLOKS.some(b=>b.kode.toLowerCase()===val.toLowerCase())){ toast('Blok ini sudah ada'); return; }
  BLOKS.push({id:uid(), kode:val});
  saveBloks();
  renderKelolaBlokModal();
  toast('Blok ditambahkan');
}
function deleteBlok(id){
  if(!confirm('Hapus blok ini?')) return;
  BLOKS = BLOKS.filter(b=>b.id!==id);
  saveBloks();
  renderKelolaBlokModal();
  toast('Blok dihapus');
}

/* ================= HARI INI ================= */
function getTodayEntry(){
  let e = ENTRIES.find(x=>x.date===todayIso());
  if(!e){
    e = {id:uid(), date:todayIso(), btId:USER.mainBt||'', hmAwal:'', hmAkhir:'', bbmLiter:'', lembur:'', catatan:''};
    ENTRIES.push(e);
    saveEntries();
  }
  return e;
}
function renderHari(){
  const host = document.getElementById('screen-hari');
  if(!USER.mainBt || UNITS.length===0){
    host.innerHTML = `<div class="card"><div class="empty-note">Kamu belum punya Unit default atau daftar unit masih kosong.<br><br>Buka menu &#9776; &rarr; Pengaturan Akun &amp; Kelola No Unit dulu ya.</div></div>`;
    return;
  }
  const e = getTodayEntry();
  host.innerHTML = `
    <div class="section-eyebrow">Truck &amp; Unit</div>
    <div class="card">
      <label class="flabel">No Unit</label>
      <select onchange="quickSave('btId', this.value)">
        ${UNITS.map(u=>`<option value="${u.id}" ${e.btId===u.id?'selected':''}>${escapeHtml(u.kode)}</option>`).join('')}
      </select>
    </div>
    <div class="section-eyebrow">Hour Meter &amp; BBM</div>
    <div class="card">
      <div class="grid2">
        <div><label class="flabel">HM Awal</label><input type="text" inputmode="decimal" value="${escapeHtml(e.hmAwal)}" onchange="this.value=fmtHm1(this.value);quickSave('hmAwal', this.value);checkHmWarning('qf')" id="qf-hmA"></div>
        <div><label class="flabel">HM Akhir</label><input type="text" inputmode="decimal" class="${hmBad(e)?'field-error':''}" value="${escapeHtml(e.hmAkhir)}" onchange="this.value=fmtHm1(this.value);quickSave('hmAkhir', this.value);checkHmWarning('qf')" id="qf-hmB"></div>
        <div class="full" id="qf-hmWarning">${hmBad(e)?'<div class="field-sub" style="color:var(--danger);">&#9888;&#65039; HM Akhir lebih kecil dari HM Awal.</div>':''}</div>
        <div><label class="flabel">BBM (liter)</label><input type="text" inputmode="numeric" value="${escapeHtml(fmtThousandsLive(e.bbmLiter))}" oninput="this.value=fmtThousandsLive(this.value)" onchange="quickSave('bbmLiter', stripDots(this.value))"></div>
        <div><label class="flabel">Jam Lembur</label><input type="text" inputmode="decimal" value="${escapeHtml(e.lembur)}" onchange="quickSave('lembur', this.value)"></div>
      </div>
      <label class="flabel">Catatan (opsional)</label>
      <textarea rows="2" onchange="quickSave('catatan', this.value)">${escapeHtml(e.catatan)}</textarea>
    </div>
  `;
}
function stripDots(v){ return v==null?'':String(v).replace(/\./g,''); }
function fmtThousandsLive(v){ const c=String(v||'').replace(/[^\d]/g,''); return c===''?'':c.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function fmtHm1(v){ if(v===''||v==null) return ''; const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?'':n.toFixed(1); }
function hmBad(e){ const a=parseFloat(e.hmAwal), b=parseFloat(e.hmAkhir); return !isNaN(a)&&!isNaN(b)&&b<a; }
function checkHmWarning(ctx){
  const hmA = document.getElementById((ctx==='qf'?'qf-hmA':'ed-hmA-'+ctx));
  const hmB = document.getElementById((ctx==='qf'?'qf-hmB':'ed-hmB-'+ctx));
  const warnEl = document.getElementById((ctx==='qf'?'qf-hmWarning':'ed-hmWarning-'+ctx));
  if(!hmA||!hmB) return;
  const a=parseFloat(hmA.value), b=parseFloat(hmB.value);
  const bad = !isNaN(a)&&!isNaN(b)&&b<a;
  hmB.classList.toggle('field-error', bad);
  if(warnEl) warnEl.innerHTML = bad ? '<div class="field-sub" style="color:var(--danger);">&#9888;&#65039; HM Akhir lebih kecil dari HM Awal.</div>' : '';
}
function quickSave(key, val){
  const e = getTodayEntry();
  e[key] = val;
  saveEntries();
  toast('Tersimpan');
}

/* ================= PLACEHOLDER SCREENS (tahap berikutnya) ================= */
function renderBeranda(){
  document.getElementById('screen-beranda').innerHTML = `<div class="card"><div class="empty-note">Beranda akan dibangun di Tahap 3.</div></div>`;
}
function toggleEditRow(id){
  const el = document.getElementById('editrow-'+id);
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}
function saveEditRow(id){
  const idx = ENTRIES.findIndex(x=>x.id===id); if(idx<0) return;
  const rawA = document.getElementById('ed-hmA-'+id).value;
  const rawB = document.getElementById('ed-hmB-'+id).value;
  ENTRIES[idx].btId = document.getElementById('ed-bt-'+id).value;
  ENTRIES[idx].date = document.getElementById('ed-date-'+id).value;
  ENTRIES[idx].hmAwal = rawA===''?'':parseFloat(rawA).toFixed(1);
  ENTRIES[idx].hmAkhir = rawB===''?'':parseFloat(rawB).toFixed(1);
  ENTRIES[idx].bbmLiter = stripDots(document.getElementById('ed-bbm-'+id).value);
  ENTRIES[idx].lembur = document.getElementById('ed-lembur-'+id).value;
  ENTRIES[idx].catatan = document.getElementById('ed-cat-'+id).value;
  saveEntries();
  toast('Perubahan disimpan');
  renderRekap();
}
function deleteRow(id){
  if(!confirm('Hapus entri ini?')) return;
  ENTRIES = ENTRIES.filter(x=>x.id!==id);
  saveEntries();
  toast('Entri dihapus');
  renderRekap();
}
function missingDays(){
  const today = todayIso();
  const dates = new Set(ENTRIES.map(e=>e.date));
  const days = [];
  for(let i=1;i<=14;i++){
    const d = new Date(today+'T00:00:00'); d.setDate(d.getDate()-i);
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!dates.has(iso)) days.push(iso);
  }
  return days;
}
function findDuplicateDates(){
  const count = {};
  ENTRIES.forEach(e=>{ const k=e.date+'|'+e.btId; count[k]=(count[k]||0)+1; });
  return new Set(Object.keys(count).filter(k=>count[k]>1));
}
function openBackfill(dateIso){
  if(!USER.mainBt || UNITS.length===0){ toast('Isi Pengaturan Akun & Kelola No Unit dulu'); return; }
  const e = {id:uid(), date:dateIso, btId:USER.mainBt, hmAwal:'', hmAkhir:'', bbmLiter:'', lembur:'', catatan:''};
  ENTRIES.push(e);
  saveEntries();
  toast('Baris baru ditambahkan, silakan diisi');
  showScreen('rekap');
  setTimeout(()=>{ const el=document.getElementById('editrow-'+e.id); if(el) el.style.display='block'; }, 50);
}
function renderRekap(){

  const monthKey = todayIso().slice(0,7);
  const monthEntries = ENTRIES.filter(e=>e.date.startsWith(monthKey));
  const totalHm = monthEntries.reduce((s,e)=>{ const a=parseFloat(e.hmAwal), b=parseFloat(e.hmAkhir); return s+((!isNaN(a)&&!isNaN(b)&&b>=a)?(b-a):0); },0);
  const totalBbm = monthEntries.reduce((s,e)=>s+(parseFloat(e.bbmLiter)||0),0);
  const totalLembur = monthEntries.reduce((s,e)=>s+(parseFloat(e.lembur)||0),0);
  const missing = missingDays();
  const dupDates = findDuplicateDates();
  const sorted = ENTRIES.slice().sort((a,b)=>b.date.localeCompare(a.date));
  host.innerHTML = `
    <div class="section-eyebrow">Bulan Ini</div>
    <div class="grid2">
      <div class="card"><div class="field-sub">Total HM</div><div style="font-size:22px;font-weight:800;">${totalHm.toFixed(1)}</div></div>
      <div class="card"><div class="field-sub">Total BBM</div><div style="font-size:22px;font-weight:800;">${fmtThousandsLive(String(Math.round(totalBbm)))} L</div></div>
      <div class="card"><div class="field-sub">Total Lembur</div><div style="font-size:22px;font-weight:800;">${totalLembur.toFixed(1)} j</div></div>
      <div class="card"><div class="field-sub">Rasio L/HM</div><div style="font-size:22px;font-weight:800;">${totalHm>0?(totalBbm/totalHm).toFixed(2):'-'}</div></div>
    </div>
    <button class="btn-block" style="margin-top:4px;" onclick="openExportSheet()">&#8595; Export Laporan</button>

    ${missing.length>0 ? `
    <div class="section-eyebrow">Belum Diisi (14 Hari Terakhir)</div>
    <div class="card" style="border-color:var(--primary);">
      <div class="field-sub" style="margin-bottom:8px;">Tap tanggal untuk isi cepat.</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${missing.map(d=>`<button class="chip" onclick="openBackfill('${d}')">${fmtLabel(d).split(', ')[1]}</button>`).join('')}
      </div>
    </div>` : ''}

    <div class="section-eyebrow section-eyebrow-row">Riwayat Lengkap<button class="pill-btn sm" onclick="openBackfill(todayIso())">+ Tambah</button></div>
    ${sorted.length===0 ? '<div class="card"><div class="empty-note">Belum ada riwayat.</div></div>' :
      sorted.map(e=>{
        const isDup = dupDates.has(e.date+'|'+e.btId);
        return `
        <div class="card" style="${isDup?'border-color:var(--danger);':''}">
          <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleEditRow('${e.id}')">
            <div>
              <div style="font-weight:800;">${fmtLabel(e.date)}</div>
              <div class="field-sub">${escapeHtml(btLabel(e.btId))} &middot; HM ${escapeHtml(e.hmAwal||'-')}&rarr;${escapeHtml(e.hmAkhir||'-')} &middot; ${escapeHtml(e.bbmLiter||'0')} L</div>
              ${isDup?'<div class="field-sub" style="color:var(--danger);font-weight:700;">&#9888;&#65039; Ada entri lain di tanggal &amp; unit yang sama</div>':''}
            </div>
            <span>&#9662;</span>
          </div>
          <div id="editrow-${e.id}" style="display:none;margin-top:12px;">
            <div class="grid2">
              <div><label class="flabel">No Unit</label><select id="ed-bt-${e.id}">${UNITS.map(u=>`<option value="${u.id}" ${e.btId===u.id?'selected':''}>${escapeHtml(u.kode)}</option>`).join('')}</select></div>
              <div><label class="flabel">Tanggal</label><input type="date" id="ed-date-${e.id}" value="${e.date}"></div>
              <div><label class="flabel">HM Awal</label><input type="text" id="ed-hmA-${e.id}" value="${escapeHtml(e.hmAwal)}" onchange="this.value=fmtHm1(this.value);checkHmWarning('${e.id}')"></div>
              <div><label class="flabel">HM Akhir</label><input type="text" id="ed-hmB-${e.id}" class="${hmBad(e)?'field-error':''}" value="${escapeHtml(e.hmAkhir)}" onchange="this.value=fmtHm1(this.value);checkHmWarning('${e.id}')"></div>
              <div class="full" id="ed-hmWarning-${e.id}">${hmBad(e)?'<div class="field-sub" style="color:var(--danger);">&#9888;&#65039; HM Akhir lebih kecil dari HM Awal.</div>':''}</div>
              <div><label class="flabel">BBM (liter)</label><input type="text" id="ed-bbm-${e.id}" inputmode="numeric" value="${escapeHtml(fmtThousandsLive(e.bbmLiter))}" oninput="this.value=fmtThousandsLive(this.value)"></div>
              <div><label class="flabel">Jam Lembur</label><input type="text" id="ed-lembur-${e.id}" value="${escapeHtml(e.lembur)}"></div>
            </div>
            <label class="flabel">Catatan</label>
            <textarea id="ed-cat-${e.id}" rows="2">${escapeHtml(e.catatan)}</textarea>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <button class="btn-block" style="flex:1;" onclick="saveEditRow('${e.id}')">Simpan</button>

function renderPeta(){
  document.getElementById('screen-peta').innerHTML = `<div class="card"><div class="empty-note">Peta akan dibangun di Tahap 4.</div></div>`;
}
function openExportSheet(){
  openModal(`
    <div class="mhead"><h2>Export / Cetak Laporan</h2><button class="mclose" onclick="closeModal()">&times;</button></div>
    <div class="section-eyebrow">Periode</div>
    <div class="chk-row"><input type="radio" name="exp-mode" id="exp-mode-month" value="month" checked onchange="updateExpModeUI()"><label for="exp-mode-month" style="margin-left:6px;">Bulan ini</label></div>
    <div class="chk-row"><input type="radio" name="exp-mode" id="exp-mode-all" value="all" onchange="updateExpModeUI()"><label for="exp-mode-all" style="margin-left:6px;">Semua periode</label></div>
    <div class="chk-row"><input type="radio" name="exp-mode" id="exp-mode-custom" value="custom" onchange="updateExpModeUI()"><label for="exp-mode-custom" style="margin-left:6px;">Rentang tanggal custom</label></div>
    <div id="exp-customRange" style="display:none;margin:8px 0;">
      <label class="flabel">Dari tanggal</label><input type="date" id="exp-dateFrom">
      <label class="flabel">Sampai tanggal</label><input type="date" id="exp-dateTo">
    </div>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="btn-block" style="flex:1;" onclick="doExport('pdf')">&#128196; PDF</button>
      <button class="btn-block outline" style="flex:1;" onclick="doExport('xlsx')">&#128202; Excel</button>
    </div>
  `);
}
function updateExpModeUI(){
  const mode = document.querySelector('input[name="exp-mode"]:checked').value;
  document.getElementById('exp-customRange').style.display = mode==='custom' ? 'block' : 'none';
}
function getExportRows(){
  const mode = document.querySelector('input[name="exp-mode"]:checked').value;
  let rows;
  if(mode==='all'){ rows = ENTRIES.slice(); }
  else if(mode==='custom'){
    const from = document.getElementById('exp-dateFrom').value;
    const to = document.getElementById('exp-dateTo').value;
    rows = ENTRIES.filter(e=>(!from||e.date>=from)&&(!to||e.date<=to));
  } else {
    const mk = todayIso().slice(0,7);
    rows = ENTRIES.filter(e=>e.date.startsWith(mk));
  }
  rows.sort((a,b)=>a.date.localeCompare(b.date));
  const headers = ['Tanggal','No Unit','HM Awal','HM Akhir','BBM (L)','Lembur (j)','Catatan'];
  const data = rows.map(e=>({
    'Tanggal': fmtLabel(e.date), 'No Unit': btLabel(e.btId), 'HM Awal': e.hmAwal||'-', 'HM Akhir': e.hmAkhir||'-',
    'BBM (L)': e.bbmLiter||'0', 'Lembur (j)': e.lembur||'0', 'Catatan': e.catatan||''
  }));
  return {headers, rows:data};
}
function exportFileLabel(){
  const mode = document.querySelector('input[name="exp-mode"]:checked').value;
  if(mode==='all') return 'semua-periode';
  if(mode==='custom'){
    const from = document.getElementById('exp-dateFrom').value || 'awal';
    const to = document.getElementById('exp-dateTo').value || 'akhir';
    return from+'_sd_'+to;
  }
  return todayIso().slice(0,7);
}
async function doExport(fmt){
  const {headers, rows} = getExportRows();
  if(rows.length===0){ toast('Tidak ada data pada periode ini'); return; }
  if(fmt==='xlsx'){
    if(!window.XLSX){ toast('Library Excel belum siap'); return; }
    const sheetData = [headers, ...rows.map(r=>headers.map(h=>r[h]))];
    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    ws['!cols'] = headers.map(h=>({wch: Math.max(h.length,12)}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Rekap');
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const result = await saveOrShareBlob(blob, 'rekap-'+exportFileLabel()+'.xlsx');
    toast(result==='shared'?'Excel siap dibagikan':'Excel diunduh');
    closeModal();
    return;
  }
  if(!window.jspdf){ toast('Library PDF belum siap'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape'});
  doc.setFontSize(14);
  doc.text('Laporan - '+exportFileLabel(), 10, 14);
  if(typeof doc.autoTable === 'function'){
    doc.autoTable({
      head: [headers], body: rows.map(r=>headers.map(h=>String(r[h]))),
      startY: 20, styles:{fontSize:8, cellPadding:2}, headStyles:{fillColor:[138,90,0]}, theme:'grid'
    });
  }
  const pdfBlob = doc.output('blob');
  const result = await saveOrShareBlob(pdfBlob, 'rekap-'+exportFileLabel()+'.pdf');
  toast(result==='shared'?'PDF siap dibagikan':'PDF diunduh');
  closeModal();
}
function isNativeApp(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=>resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function saveOrShareBlob(blob, filename){
  if(isNativeApp() && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem){
    try{
      const { Filesystem } = window.Capacitor.Plugins;
      const base64 = await blobToBase64(blob);
      const written = await Filesystem.writeFile({ path: filename, data: base64, directory: 'CACHE', recursive: true });
      if(window.Capacitor.Plugins.Share){
        await window.Capacitor.Plugins.Share.share({ title: filename, url: written.uri, dialogTitle: 'Simpan atau bagikan file' });
        return 'shared';
      }
      return 'saved-native';
    }catch(err){
      const msg = err && err.message ? err.message : JSON.stringify(err);
      if(!/cancel/i.test(msg)) alert('Gagal simpan: '+msg);
    }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel='noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return 'downloaded';
  }catch(err){
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    return 'opened';
  }
}
