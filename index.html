<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Jadwal BT</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7A4A00">
<script src="vendor/jspdf.umd.min.js"></script>
<script>
  if (!window.jspdf) {
    var _jspdfFallback = document.createElement('script');
    _jspdfFallback.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js';
    document.head.appendChild(_jspdfFallback);
  }
</script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#8A5A00; --on-primary:#FFFFFF; --primary-container:#FFDDAE; --on-primary-container:#2B1700;
  --secondary:#5C5240; --secondary-container:#E6DCC6;
  --success:#2E7D32; --success-container:#D7ECD9;
  --danger:#B3261E; --danger-container:#F9DEDC;
  --surface:#FFF8F3; --surface-container:#F3E8DA; --surface-container-high:#ECDFCB; --surface-container-low:#F8EFE4;
  --on-surface:#1F1B13; --on-surface-variant:#4E4636;
  --outline:#D6C6AC; --outline-variant:#E8DCC8;
  --navy:#1C2333;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--surface);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--on-surface);}
button,input,select,textarea{font-family:inherit;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
#topbar{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top, 24px)) 16px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
#topbar .hbtn{background:none;border:none;color:#fff;font-size:22px;padding:6px;cursor:pointer;line-height:1;}
#topbar .titles{flex:1;min-width:0;}
#topbar .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#D8CBE8;font-weight:700;}
#topbar .titlemain{font-size:16px;font-weight:800;margin-top:2px;}
#topbar .badge{background:var(--primary-container);color:var(--on-primary-container);font-size:12px;font-weight:700;padding:6px 12px;border-radius:100px;white-space:nowrap;}
#screens{flex:1;overflow-y:auto;padding:16px 16px 100px;}
#screens.no-pad{padding:0;overflow:hidden;}
#screen-peta{height:100%;}
.screen{display:none;}
.screen.active{display:block;}
#bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;justify-content:space-around;padding:8px 4px calc(10px + env(safe-area-inset-bottom, 20px));z-index:40;}
#bottomnav button{background:none;border:none;color:#9AA0B4;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 10px;border-radius:16px;cursor:pointer;}
#bottomnav button svg{width:22px;height:22px;}
#bottomnav button.active{color:var(--primary-container);background:rgba(255,255,255,.08);}

.section-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface-variant);font-weight:700;margin:18px 0 8px;}
.section-eyebrow:first-child{margin-top:0;}
.section-eyebrow-row{display:flex;justify-content:space-between;align-items:center;}
.card{background:#fff;border:1px solid var(--outline-variant);border-radius:20px;padding:16px;margin-bottom:14px;}
.card-flat{background:var(--surface-container);border:none;}

input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;border:1.5px solid var(--outline);border-radius:14px;padding:10px 12px;font-size:16px;min-height:44px;
  background:var(--surface-container-low);color:var(--on-surface);margin-bottom:8px;
}
input.field-error{border-color:var(--danger)!important;background:var(--danger-container);}
textarea{resize:vertical;min-height:44px;}
label.flabel{display:block;font-size:12px;font-weight:700;color:var(--on-surface-variant);margin-bottom:3px;}
.field-sub{font-size:12px;color:var(--on-surface-variant);}
.drawer-version{padding:6px 18px 20px;font-size:12px;color:var(--on-surface-variant);}
.grid2{display:grid;grid-template-columns:1fr;gap:4px 12px;}
.grid2 .full{grid-column:1/-1;}
@media (min-width:400px){ .grid2{grid-template-columns:1fr 1fr;} }

.pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:var(--on-primary);border:none;border-radius:100px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;}
.pill-btn.outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
.pill-btn.sm{padding:7px 12px;font-size:12px;}
.btn-block{display:block;width:100%;text-align:center;background:var(--primary);color:var(--on-primary);border:none;border-radius:16px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;}
.btn-block.outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-container);border:1.5px solid var(--outline);border-radius:100px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--on-surface);}
.chip.active{background:var(--primary-container);border-color:var(--primary-container);color:var(--on-primary-container);}
.chk-row{display:flex;align-items:center;padding:8px 0;font-size:14px;}
.chk-row input[type=radio]{width:auto;min-height:auto;margin:0;}

/* Drawer (hamburger) */
#drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;}
#drawerOverlay.show{display:block;}
#drawer{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:320px;background:#fff;z-index:61;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;}
#drawer.show{transform:translateX(0);}
#drawer .dhead{background:var(--navy);color:#fff;padding:24px 20px;}
#drawer .dhead .name{font-size:18px;font-weight:800;}
#drawer .dhead .sub{font-size:12px;color:#B9C0D6;margin-top:2px;}
#drawer .ditem{display:flex;align-items:center;gap:14px;padding:14px 20px;font-size:15px;font-weight:600;color:var(--on-surface);cursor:pointer;border-bottom:1px solid var(--outline-variant);}
#drawer .ditem .ic{width:22px;text-align:center;}
#drawer .dgroup{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant);font-weight:700;padding:16px 20px 4px;}

/* Modal sheet */
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:none;align-items:flex-end;}
#modalOverlay.show{display:flex;}
#modalSheet{background:var(--surface);width:100%;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom, 20px));}
#modalSheet .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
#modalSheet .mhead h2{font-size:18px;margin:0;font-weight:800;}
#modalSheet .mclose{background:var(--surface-container);border:none;border-radius:100px;width:36px;height:36px;font-size:18px;cursor:pointer;}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:100px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:90;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.empty-note{text-align:center;color:var(--on-surface-variant);padding:24px 12px;font-size:13px;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--outline-variant);}
.list-row:last-child{border-bottom:none;}
.icon-btn{background:none;border:none;font-size:16px;padding:6px;cursor:pointer;color:var(--on-surface-variant);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="hbtn" onclick="openDrawer()">&#9776;</button>
    <div class="titles">
      <div class="eyebrow" id="tb-eyebrow">BERANDA</div>
      <div class="titlemain" id="tb-title">Ringkasan</div>
    </div>
    <div class="badge" id="tb-badge">-</div>
  </div>

  <div id="screens">
    <div class="screen active" id="screen-beranda"></div>
    <div class="screen" id="screen-hari"></div>
    <div class="screen" id="screen-peta"></div>
    <div class="screen" id="screen-rekap"></div>
  </div>

  <nav id="bottomnav">
    <button data-tab="beranda" onclick="showScreen('beranda')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Beranda</span>
    </button>
    <button data-tab="hari" onclick="showScreen('hari')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
      <span>Hari Ini</span>
    </button>
    <button data-tab="peta" onclick="showScreen('peta')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/></svg>
      <span>Peta</span>
    </button>
    <button data-tab="rekap" onclick="showScreen('rekap')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span>Rekap</span>
    </button>
  </nav>
</div>

<div id="drawerOverlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="dhead">
    <div class="name" id="dw-name">Nama belum diisi</div>
    <div class="sub" id="dw-unit">Unit default: -</div>
  </div>
  <div class="dgroup">Akun</div>
  <div class="ditem" onclick="openSettingAkun()"><span class="ic">&#9881;</span> Pengaturan Akun</div>
  <div class="dgroup">Master Data</div>
  <div class="ditem" onclick="openKelolaUnit()"><span class="ic">&#128666;</span> No Unit</div>
  <div class="ditem" onclick="openKelolaBlok()"><span class="ic">&#128506;</span> No Blok</div>
  <div class="ditem" onclick="openKelolaJenis()"><span class="ic">&#128203;</span> Jenis Layanan</div>
  <div class="ditem" onclick="openKelolaTipeAntar()"><span class="ic">&#128101;</span> Tipe (Antar/Jemput)</div>
  <div class="ditem" onclick="openKelolaKegiatan()"><span class="ic">&#128221;</span> Kegiatan</div>
  <div class="dgroup">Servis</div>
  <div class="ditem" onclick="openServisModal()"><span class="ic">&#128295;</span> Riwayat &amp; Catat Servis</div>
  <div class="ditem" onclick="openGantiHmModal()"><span class="ic">&#128260;</span> Ganti HM Manual</div>
  <div class="dgroup">Peta</div>
  <div class="ditem" onclick="closeDrawer();document.getElementById('petaFileInputDrawer').click()"><span class="ic">&#128247;</span> Ganti Gambar Peta</div>
  <input type="file" accept="image/*" id="petaFileInputDrawer" style="display:none;" onchange="handlePetaUpload(event)">
  <div class="dgroup">Tentang</div>
  <div class="drawer-version" id="dw-version">Versi 1.0.7 &middot; 14 Agu 2026</div>
  <div class="drawer-version" style="padding-top:0;opacity:.7;">Yohanes Div.2</div>
</div>

<div id="modalOverlay"><div id="modalSheet"></div></div>
<datalist id="lokasiSuggest"></datalist>
<div id="toast"></div>

<script>
/* ================= DATA LAYER ================= */
const LS = {
  get(key, def){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }
};
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtLabel(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jumat",'Sabtu'][d.getDay()];
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()];
  return hari+', '+d.getDate()+' '+bulan+' '+d.getFullYear();
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('show'),2200); }

let expandedRowId = null;
let USER = LS.get('v2_user', {name:'', mainBt:''});
let UNITS = LS.get('v2_units', []);       // [{id, kode}]
let BLOKS = LS.get('v2_bloks', []);       // [{id, kode}]
let ENTRIES = LS.get('v2_entries', []);   // daily log entries
let SERVIS = LS.get('v2_servis', []);     // [{id, btId, date, hm, note}]
let HM_RESETS = LS.get('v2_hmresets', []); // [{id, btId, date, note}]
let SETTINGS = LS.get('v2_settings', {serviceInterval:240});
let JENIS_LAYANAN_LIST = LS.get('v2_jenis', ['Antar/Jemput Tenaga','Muat Tebu','Drone','Operator']);
let TIPE_ANTAR_LIST = LS.get('v2_tipeantar', ['Pekerja Kebun','Tebang','Tanam']);
let KEGIATAN_LIST = LS.get('v2_kegiatan', ['Pel. Umum','Pemupukan','Penyemprotan']);
let MUAT_TIPE_LIST = LS.get('v2_muattipe', ['Bibit','Produksi']);
let DRONE_JENIS_LIST = LS.get('v2_dronejenis', ['Penyemprotan','Pemetaan']);
let SHIFT_LIST = LS.get('v2_shift', ['Pagi','Siang','Malam']);
function saveUser(){ LS.set('v2_user', USER); }
function saveUnits(){ LS.set('v2_units', UNITS); }
function saveBloks(){ LS.set('v2_bloks', BLOKS); }
function saveEntries(){ LS.set('v2_entries', ENTRIES); }
function saveServis(){ LS.set('v2_servis', SERVIS); }
function saveHmResets(){ LS.set('v2_hmresets', HM_RESETS); }
function saveSettings(){ LS.set('v2_settings', SETTINGS); }
function saveJenisList(){ LS.set('v2_jenis', JENIS_LAYANAN_LIST); }
function saveTipeAntarList(){ LS.set('v2_tipeantar', TIPE_ANTAR_LIST); }
function saveKegiatanList(){ LS.set('v2_kegiatan', KEGIATAN_LIST); }
function saveMuatTipeList(){ LS.set('v2_muattipe', MUAT_TIPE_LIST); }
function saveDroneJenisList(){ LS.set('v2_dronejenis', DRONE_JENIS_LIST); }
function saveShiftList(){ LS.set('v2_shift', SHIFT_LIST); }

/* ================= NAVIGATION ================= */
const TITLES = {
  beranda:['BERANDA', 'Ringkasan'],
  hari:['HARI INI', ()=>fmtLabel(todayIso())],
  peta:['PETA', 'Lokasi Kerja'],
  rekap:['REKAP', 'Riwayat & Laporan']
};
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('screens').classList.toggle('no-pad', name==='peta');
  document.querySelectorAll('#bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  const t = TITLES[name];
  document.getElementById('tb-eyebrow').textContent = t[0];
  document.getElementById('tb-title').textContent = typeof t[1]==='function' ? t[1]() : t[1];
  document.getElementById('tb-badge').textContent = USER.mainBt ? btLabel(USER.mainBt) : '-';
  if(name==='beranda') renderBeranda();
  if(name==='hari') renderHari();
  if(name==='rekap') renderRekap();
  if(name==='peta') renderPeta();
}
function btLabel(id){ const u = UNITS.find(x=>x.id===id); return u ? u.kode : '-'; }

/* ================= DRAWER ================= */
function openDrawer(){
  document.getElementById('dw-name').textContent = USER.name || 'Nama belum diisi';
  document.getElementById('dw-unit').textContent = 'Unit default: '+(USER.mainBt ? btLabel(USER.mainBt) : '-');
  document.getElementById('drawerOverlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}

/* ================= MODAL HELPER ================= */
function openModal(html){
  document.getElementById('modalSheet').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }

/* ================= PENGATURAN AKUN ================= */
function openSettingAkun(){
  closeDrawer();
  openModal(`
    <div class="mhead"><h2>Pengaturan Akun</h2><button class="mclose" onclick="closeModal()">&times;</button></div>
    <label class="flabel">Nama Kamu</label>
    <input type="text" id="setNama" value="${escapeHtml(USER.name)}" placeholder="mis. Yohanes">
    <label class="flabel">Unit Default</label>
    <select id="setUnit">
      <option value="">- Pilih unit -</option>
      ${UNITS.map(u=>`<option value="${u.id}" ${USER.mainBt===u.id?'selected':''}>${escapeHtml(u.kode)}</option>`).join('')}
    </select>
    <button class="btn-block" onclick="saveSettingAkun()">Simpan</button>
  `);
}
function saveSettingAkun(){
  USER.name = document.getElementById('setNama').value.trim();
  USER.mainBt = document.getElementById('setUnit').value;
  saveUser();
  closeModal();
  toast('Pengaturan akun disimpan');
  showScreen(document.querySelector('#bottomnav button.active').dataset.tab);
}

/* ================= KELOLA UNIT ================= */
function openKelolaUnit(){
  closeDrawer();
  renderKelolaUnitModal();
}
function renderKelolaUnitModal(){
  openModal(`
    <div class="mhead"><h2>Kelola No Unit</h2><button class="mclose" onclick="closeModal()">&times;</button></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input type="text" id="newUnitKode" placeholder="mis. BT.14" style="margin-bottom:0;">
      <button class="pill-btn" onclick="addUnit()">+ Tambah</button>
    </div>
    <div class="card card-flat">
      ${UNITS.length===0 ? '<div class="empty-note">Belum ada unit. Tambahkan di atas.</div>' :
        UNITS.map(u=>`<div class="list-row"><span>${escapeHtml(u.kode)}</span><button class="icon-btn" onclick="deleteUnit('${u.id}')">&#128465;</button></div>`).join('')}
    </div>
  `);
}
function addUnit(){
  const val = document.getElementById('newUnitKode').value.trim();
  if(!val){ toast('Isi nomor unit dulu'); return; }
  if(UNITS.some(u=>u.kode.toLowerCase()===val.toLowerCase())){ toast('Unit ini sudah ada'); return; }
  UNITS.push({id:uid(), kode:val});
  saveUnits();
  renderKelolaUnitModal();
  toast('Unit ditambahkan');
}
function deleteUnit(id){
  if(!confirm('Hapus unit ini? Data entri lama yang memakai unit ini tidak akan terhapus, tapi labelnya akan hilang.')) return;
  UNITS = UNITS.filter(u=>u.id!==id);
  saveUnits();
  renderKelolaUnitModal();
  toast('Unit dihapus');
}

/* ================= KELOLA BLOK ================= */
function openKelolaBlok(){
  closeDrawer();
  renderKelolaBlokModal();
}
function renderKelolaBlokModal(){
  openModal(`
    <div class="mhead"><h2>Kelola No Blok</h2><button class="mclose" onclick="closeModal()">&times;</button></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input type="text" id="newBlokKode" placeholder="mis. 11 TS 22" oninput="this.value=fmtBlokKode(this.value)" style="margin-bottom:0;">
      <button class="pill-btn" onclick="addBlok()">+ Tambah</button>
    </div>
    <div class="card card-flat">
      ${BLOKS.length===0 ? '<div class="empty-note">Belum ada blok. Tambahkan di atas.</div>' :
        BLOKS.map(b=>`<div class="list-row"><span>${escapeHtml(b.kode)}</span><button class="icon-btn" onclick="deleteBlok('${b.id}')">&#128465;</button></div>`).join('')}
    </div>
  `);
}
function addBlok(){
  const val = document.getElementById('newBlokKode').value.trim();
  if(!val){ toast('Isi nomor blok dulu'); return; }
  if(BLOKS.some(b=>b.kode.toLowerCase()===val.toLowerCase())){ toast('Blok ini sudah ada'); return; }
  BLOKS.push({id:uid(), kode:val});
  saveBloks();
  renderKelolaBlokModal();
  toast('Blok ditambahkan');
}
function deleteBlok(id){
  if(!confirm('Hapus blok ini?')) return;
  BLOKS = BLOKS.filter(b=>b.id!==id);
  saveBloks();
  renderKelolaBlokModal();
  toast('Blok dihapus');
}
function openKelolaJenis(){
  closeDrawer();
  renderKelolaJenisModal();
}
function renderKelolaJenisModal(){
  openModal(`
    <div class="mhead"><h2>Kelola Jenis Layanan</h2><button class="mclose" onclick="closeModal()">&times;</button></div>
    <div class="field-sub" style="margin-bottom:10px;">4 jenis pertama (Antar/Jemput Tenaga, Muat Tebu, Drone, Operator) punya field khusus otomatis. Jenis tambahan akan pakai field Lokasi biasa.</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input type="text" id="newJenisKode" placeholder="mis. Perawatan Jalan" style="margin-bottom:0;">
      <button class="pill-btn" onclick="addJenis()">+ Tambah</button>
    </div>
    <div class="card card-flat">
      ${JENIS_LAYANAN_LIST.map(j=>`<div class="list-row"><span>${escapeHtml(j)}</span><button class="icon-btn" onclick="deleteJenis('${escapeHtml(j)}')">&#128465;</button></div>`).join('')}
    </div>
  `);
}
function addJenis(){
  const val = document.getElementById('newJenisKode').value.trim();
  if(!val){ toast('Isi nama jenis layanan dulu'); return; }
  if(JENIS_LAYANAN_LIST.some(j=>j.toLowerCase()===val.toLowerCase())){ toast('Jenis ini sudah ada'); return; }
  JENIS_LAYANAN_LIST.push(val);
  saveJenisList();

  const hmA = document.getElementById('qf2-hmA-'+entryId);

function entryTipeLabel(e){

function lokasiSuggestions(){
  const set = new Set();
  ENTRIES.forEach(e=>{ [e.lokasi,e.lokasiMuat,e.lokasiBongkar].forEach(l=>{ if(l) set.add(l); }); });
  PETA_BLOCKS.forEach(b=>{ if(b.label) set.add(b.label); });
  BLOKS.forEach(b=>{ if(b.kode) set.add(b.kode); });
  return Array.from(set);
}
function refreshLokasiDatalist(filterText){
  const all = lokasiSuggestions();
  const q = String(filterText||'').toLowerCase().trim();
  let matches = q ? all.filter(l=>l.toLowerCase().includes(q)) : all.slice();
  matches.reverse();
  matches = matches.slice(0,7);
  const dl = document.getElementById('lokasiSuggest');
  if(dl) dl.innerHTML = matches.map(l=>`<option value="${escapeHtml(l)}">`).join('');
}
function fmtBlokKode(v){
  const raw = String(v||'');
  const stripped = raw.replace(/\s+/g,'');
  if(stripped.length<2 || !/^\d{2}/.test(stripped)) return raw;
  let out = '';
  for(let i=0;i<stripped.length;i++){
    let ch = stripped[i];
    if(i>=2 && i<4) ch = ch.toUpperCase();
    out += ch;
    if((i===1 || i===3) && i+1<stripped.length) out += ' ';
  }
  return out;
}
function onLokasiInput(el){
  el.value = fmtBlokKode(el.value);
  refreshLokasiDatalist(el.value);
}
function onLokasiFocus(el){
  refreshLokasiDatalist(el.value);
  setTimeout(()=>{ el.scrollIntoView({behavior:'smooth', block:'center'}); }, 250);
}
function stripDots(v){ return v==null?'':String(v).replace(/\./g,''); }
function fmtThousandsLive(v){ const c=String(v||'').replace(/[^\d]/g,''); return c===''?'':c.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function fmtHm1(v){ if(v===''||v==null) return ''; const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?'':n.toFixed(1); }
function fmtHmLive(v){
  const digits = String(v||'').replace(/\D/g,'').slice(0,5);
  if(digits==='') return '';
  if(digits.length===1) return digits;
  return digits.slice(0,-1)+'.'+digits.slice(-1);
}
function hmBad(e){ const a=parseFloat(e.hmAwal), b=parseFloat(e.hmAkhir); return !isNaN(a)&&!isNaN(b)&&b<a; }
function checkHmWarning(ctx){

  if(!hmA||!hmB) return;
  const a=parseFloat(hmA.value), b=parseFloat(hmB.value);
  const bad = !isNaN(a)&&!isNaN(b)&&b<a;
  hmB.classList.toggle('field-error', bad);
  if(warnEl) warnEl.innerHTML = bad ? '<div class="field-sub" style="color:var(--danger);">&#9888;&#65039; HM Akhir lebih kecil dari HM Awal.</div>' : '';
}
function parseHHMM(s){
  if(!s) return null;
  const parts = String(s).split(':');
  if(parts.length<2) return null;
  const h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  if(isNaN(h)||isNaN(m)) return null;
  return h + m/60;
}
function parseJamTitik(s){
  if(!s) return null;
  const norm = String(s).trim().replace(',', '.').replace('.', ':');
  const parts = norm.split(':');
  if(parts.length<2) return null;
  const h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  if(isNaN(h)||isNaN(m)) return null;
  return h + m/60;
}
function normalJamKerja(dateIso, liburMerah){
  if(liburMerah) return 0;
  const dow = new Date(dateIso+'T00:00:00').getDay();
  if(dow===0) return 0;      // Minggu
  if(dow===6) return 5.5;    // Sabtu
  if(dow===5) return 6.5;    // Jumat
  return 7;                  // Senin-Kamis
}
function computeLembur(e){
  const start = parseHHMM(e.absenBerangkat);
  const end = parseHHMM(e.absenPulang);
  if(start===null || end===null) return null;
  let worked = end - start;
  if(worked < 0) worked += 24;
  if(e.istirahat){
    const im = parseJamTitik(e.istMulai);
    const is = parseJamTitik(e.istSelesai);
    if(im!==null && is!==null){
      let istDur = is - im;
      if(istDur < 0) istDur += 24;
      worked -= istDur;
    }
  }
  const normal = normalJamKerja(e.date, e.liburMerah);
  let lembur = worked - normal;
  if(lembur < 0) lembur = 0;
  return lembur;
}
const LEMBUR_TRIGGER_KEYS = ['absenBerangkat','absenPulang','istirahat','istMulai','istSelesai','liburMerah','date'];
function recomputeLemburIfNeeded(entry, changedKey){
  if(!LEMBUR_TRIGGER_KEYS.includes(changedKey)) return;
  const val = computeLembur(entry);
  if(val!==null) entry.lembur = val.toFixed(1);
}

}

function lastServisForBt(btId){
  const list = SERVIS.filter(s=>s.btId===btId && s.type==='berkala').sort((a,b)=>b.date.localeCompare(a.date));
  return list[0] || null;
}
function lastHmResetForBt(btId){
  const list = HM_RESETS.filter(r=>r.btId===btId).sort((a,b)=>b.date.localeCompare(a.date));
  return list[0] || null;
}
function currentHmForBt(btId){
  const reset = lastHmResetForBt(btId);
  const valid = ENTRIES.filter(e=>e.btId===btId && e.hmAkhir!=='' && e.hmAkhir!=null && !isNaN(parseFloat(e.hmAkhir)) && (!reset || e.date>=reset.date));
  if(valid.length===0) return null;
  valid.sort((a,b)=>a.date.localeCompare(b.date) || (a.id>b.id?1:-1));
  return parseFloat(valid[valid.length-1].hmAkhir);
}
function hmServiceStatus(btId){
  const last = lastServisForBt(btId);
  const current = currentHmForBt(btId);
  const baseHm = last ? (parseFloat(last.hm)||0) : null;
  const sisa = (baseHm!==null && current!==null) ? Math.max(0, current-baseHm) : null;
  return {last, current, baseHm, sisa};
}
function maybeDetectHmReset(btId, newHmAkhirVal, entryDate){
  if(newHmAkhirVal===''||newHmAkhirVal==null||!btId) return;
  const newVal = parseFloat(newHmAkhirVal);
  if(isNaN(newVal)) return;
  const prevMax = currentHmForBt(btId);
  if(prevMax!==null && prevMax>50 && newVal < prevMax*0.7 && (prevMax-newVal)>100){
    const ok = confirm('HM Akhir ('+newVal.toFixed(1)+') turun drastis dari catatan sebelumnya ('+prevMax.toFixed(1)+') untuk '+btLabel(btId)+'.\\n\\nApakah HM meter unit ini diganti/direset (misalnya karena rusak)?');
    if(ok){
      HM_RESETS.push({id:uid(), btId, date: entryDate||todayIso(), note:'Reset otomatis: HM turun dari '+prevMax.toFixed(1)+' ke '+newVal.toFixed(1)});
      saveHmResets();
      toast('Dicatat: HM '+btLabel(btId)+' di-reset mulai '+fmtLabel(entryDate||todayIso()));
    }
  }
}

    else if(fieldKey==='tipeAntar'){ if(!TIPE_ANTAR_LIST.includes(typed)){ TIPE_ANTAR_LIST.push(typed); saveTipeAntarList(); } }
    else if(fieldKey==='kegiatan'){ if(!KEGIATAN_LIST.includes(typed)){ KEGIATAN_LIST.push(typed); saveKegiatanList(); } }
    else if(fieldKey==='muatTipe'){ if(!MUAT_TIPE_LIST.includes(typed)){ MUAT_TIPE_LIST.push(typed); saveMuatTipeList(); } }
    else if(fieldKey==='droneJenis'){ if(!DRONE_JENIS_LIST.includes(typed)){ DRONE_JENIS_LIST.push(typed); saveDroneJenisList(); } }
    else if(fieldKey==='shift'){ if(!SHIFT_LIST.includes(typed)){ SHIFT_LIST.push(typed); saveShiftList(); } }
    editEntryField(entryId, fieldKey, typed);
  } else {
    editEntryField(entryId, fieldKey, val);
  }
}
function editEntryField(entryId, key, val){
  const idx = ENTRIES.findIndex(x=>x.id===entryId); if(idx<0) return;
  if(key==='hmAwal' || key==='hmAkhir'){
    val = val===''?'':parseFloat(val).toFixed(1);
  }
  if(key==='hmAkhir' && val!==''){
    maybeDetectHmReset(ENTRIES[idx].btId, val, ENTRIES[idx].date);
  }
  ENTRIES[idx][key] = val;
  recomputeLemburIfNeeded(ENTRIES[idx], key);
  saveEntries();
  toast('Tersimpan');
  expandedRowId = entryId;
  renderRekap();
}
function toggleSecondaryFlag(entryId){
  const idx = ENTRIES.findIndex(x=>x.id===entryId); if(idx<0) return;
  const e = ENTRIES[idx];
  if(e.isSecondary){
    e.isSecondary = false;
    if(!e.istMulai) e.istMulai = '11.00';
    if(!e.istSelesai) e.istSelesai = '13.30';
    if(e.istirahat===undefined) e.istirahat = true;
    toast('Dijadikan entri utama — isi Absen supaya lembur terhitung otomatis');
  } else {
    e.isSecondary = true;
    e.absenBerangkat = '';
    e.absenPulang = '';
    toast('Dijadikan entri tambahan — Absen dikosongkan, isi Jam Lembur manual');
  }
  saveEntries();
  expandedRowId = entryId;
  renderRekap();
}
function deleteRow(id){
  if(!confirm('Hapus entri ini?')) return;
  ENTRIES = ENTRIES.filter(x=>x.id!==id);

function missingDays(){
  const today = todayIso();
  const dates = new Set(ENTRIES.map(e=>e.date));
  const days = [];
  for(let i=1;i<=30;i++){
    const d = new Date(today+'T00:00:00'); d.setDate(d.getDate()-i);
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!dates.has(iso)) days.push(iso);
  }
  return days;
}
function findDuplicateDates(){
  const count = {};
  ENTRIES.forEach(e=>{ const k=e.date+'|'+e.btId; count[k]=(count[k]||0)+1; });
  return new Set(Object.keys(count).filter(k=>count[k]>1));
}

/* Gambar peta disimpan di IndexedDB (jatah jauh lebih besar dari localStorage, cocok untuk gambar beresolusi tinggi) */
const PETA_DB_NAME = 'jadwalbt_peta_db';
const PETA_STORE = 'images';
function petaDbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(PETA_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(PETA_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function petaDbGet(key){
  const db = await petaDbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(PETA_STORE, 'readonly');
    const req = tx.objectStore(PETA_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function petaDbSet(key, val){
  const db = await petaDbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(PETA_STORE, 'readwrite');
    tx.objectStore(PETA_STORE).put(val, key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}

function handlePetaUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  toast('Memproses gambar...');
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = async function(){
      // Resize ke maksimal 3600px sisi terpanjang -- cukup detail untuk zoom 8x pada peta blok yang rapat
      const maxDim = 3600;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        const scale = maxDim / Math.max(w,h);
        w = Math.round(w*scale); h = Math.round(h*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      PETA_IMAGE = canvas.toDataURL('image/jpeg', 0.85);
      try{
        await petaDbSet('main', PETA_IMAGE);
        toast('Gambar peta disimpan');
        petaZoom = {scale:1, panX:0, panY:0};
      }catch(err){
        toast('Gagal simpan gambar: '+(err&&err.message?err.message:'penyimpanan penuh'));
      }
      renderPeta();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
let petaZoom = {scale:1, panX:0, panY:0};
let petaTouchState = null;
let petaJustDragged = false;
function applyPetaTransform(){
  const inner = document.getElementById('petaImgInner');
  if(inner) inner.style.transform = `translate(${petaZoom.panX}px, ${petaZoom.panY}px) scale(${petaZoom.scale})`;
  const r = Math.max(0.04, 0.15/petaZoom.scale).toFixed(3);
  document.querySelectorAll('.peta-drawdot').forEach(c=>{ c.setAttribute('r', r); });
}
function resetPetaZoom(){
  petaZoom = {scale:1, panX:0, panY:0};
  applyPetaTransform();
}
function clampPan(){
  const wrap = document.getElementById('petaImgWrap');
  if(!wrap) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const maxX = w*(petaZoom.scale-1), maxY = h*(petaZoom.scale-1);
  petaZoom.panX = Math.min(0, Math.max(-maxX, petaZoom.panX));
  petaZoom.panY = Math.min(0, Math.max(-maxY, petaZoom.panY));
}
function petaTouchStart(e){
  const wrap = document.getElementById('petaImgWrap');
  const rect = wrap.getBoundingClientRect();
  if(e.touches.length===2){
    const [t1,t2] = e.touches;
    const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    const midX = (t1.clientX+t2.clientX)/2 - rect.left;
    const midY = (t1.clientY+t2.clientY)/2 - rect.top;
    petaTouchState = {mode:'pinch', startDist:dist, startScale:petaZoom.scale, midX, midY, startPanX:petaZoom.panX, startPanY:petaZoom.panY};
  } else if(e.touches.length===1){
    petaTouchState = {mode:'pan', startX:e.touches[0].clientX, startY:e.touches[0].clientY, startPanX:petaZoom.panX, startPanY:petaZoom.panY, moved:false};
  }
}
function petaTouchMove(e){
  if(!petaTouchState) return;
  if(petaTouchState.mode==='pinch' && e.touches.length===2){
    e.preventDefault();
    const [t1,t2] = e.touches;
    const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    const newScale = Math.min(12, Math.max(1, petaTouchState.startScale * (dist/petaTouchState.startDist)));
    const contentX = (petaTouchState.midX - petaTouchState.startPanX) / petaTouchState.startScale;
    const contentY = (petaTouchState.midY - petaTouchState.startPanY) / petaTouchState.startScale;
    petaZoom.scale = newScale;
    petaZoom.panX = petaTouchState.midX - contentX*newScale;
    petaZoom.panY = petaTouchState.midY - contentY*newScale;
    clampPan();
    applyPetaTransform();
  } else if(petaTouchState.mode==='pan' && e.touches.length===1){
    const dx = e.touches[0].clientX - petaTouchState.startX;
    const dy = e.touches[0].clientY - petaTouchState.startY;
    if(Math.abs(dx)>5 || Math.abs(dy)>5) petaTouchState.moved = true;
    if(petaZoom.scale>1){
      e.preventDefault();
      petaZoom.panX = petaTouchState.startPanX + dx;
      petaZoom.panY = petaTouchState.startPanY + dy;
      clampPan();
      applyPetaTransform();
    }
  }
}
function petaTouchEnd(e){
  if(petaTouchState && (petaTouchState.mode==='pinch' || (petaTouchState.mode==='pan' && petaTouchState.moved))){
    petaJustDragged = true;
    setTimeout(()=>{ petaJustDragged = false; }, 200);
  }
  petaTouchState = null;
}
function petaTapCoords(evt){
  const wrap = document.getElementById('petaImgWrap');
  const rect = wrap.getBoundingClientRect();
  const localX = (evt.clientX - rect.left - petaZoom.panX) / petaZoom.scale;
  const localY = (evt.clientY - rect.top - petaZoom.panY) / petaZoom.scale;
  return {
    x: +(localX / rect.width * 100).toFixed(2),
    y: +(localY / rect.height * 100).toFixed(2)
  };
}
function startPetaDraw(){
  petaDrawing = true;
  petaDrawPoints = [];
  renderPeta();
}
function cancelPetaDraw(){
  petaDrawing = false;
  petaDrawPoints = [];
  renderPeta();
}
function undoPetaPoint(){
  if(petaDrawPoints.length>0){ petaDrawPoints.pop(); renderPeta(); }
}
function finishPetaDraw(){
  if(petaDrawPoints.length < 3){ toast('Minimal 3 titik untuk membentuk area'); return; }
  const label = prompt('Nama blok ini?');
  if(!label){ return; }
  PETA_BLOCKS.push({id:uid(), label, points: petaDrawPoints.slice(), date: todayIso()});
  savePetaBlocks();
  if(!BLOKS.some(b=>b.kode.toLowerCase()===label.toLowerCase())){
    BLOKS.push({id:uid(), kode:label});
    saveBloks();
  }
  petaDrawing = false;
  petaDrawPoints = [];
  renderPeta();
  toast('Blok ditambahkan');
}
function pointInPolygon(pt, points){
  let inside = false;
  for(let i=0,j=points.length-1; i<points.length; j=i++){
    const xi=points[i].x, yi=points[i].y, xj=points[j].x, yj=points[j].y;
    const intersect = ((yi>pt.y)!==(yj>pt.y)) && (pt.x < (xj-xi)*(pt.y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function handlePetaTap(evt){
  if(petaJustDragged) return;
  const pt = petaTapCoords(evt);
  if(petaDrawing){
    petaDrawPoints.push(pt);
    renderPeta();
    return;
  }
  const hit = PETA_BLOCKS.find(b=>pointInPolygon(pt, b.points));
  if(hit){
    showPetaBlock(hit.id);
  }
}
let _petaActiveBlockId = null;
function showPetaBlock(id){
  const b = PETA_BLOCKS.find(x=>x.id===id);
  if(!b) return;
  _petaActiveBlockId = id;
  openModal(`
    <div class="mhead"><h2>&#128506; ${escapeHtml(b.label)}</h2><button class="mclose" onclick="closeModal()">&times;</button></div>
    <div class="field-sub" style="margin-bottom:16px;">Ditandai: ${fmtLabel(b.date)}</div>
    <button class="btn-block" onclick="usePetaBlockAsLokasi('${b.id}')">Jadikan Lokasi Hari Ini</button>
    <button class="pill-btn outline" style="margin-top:8px;width:100%;justify-content:center;" onclick="editPetaBlockName('${b.id}')">&#9998; Edit Nama</button>
    <button class="pill-btn outline" style="margin-top:8px;width:100%;justify-content:center;" onclick="deletePetaBlock('${b.id}');closeModal();">Hapus Blok</button>
  `);
}
function editPetaBlockName(id){
  const b = PETA_BLOCKS.find(x=>x.id===id);
  if(!b) return;
  const newLabel = prompt('Ganti nama blok:', b.label);
  if(!newLabel) return;
  b.label = newLabel;
  savePetaBlocks();
  toast('Nama blok diperbarui');
  closeModal();
  renderPeta();
}
function usePetaBlockAsLokasi(id){
  const b = PETA_BLOCKS.find(x=>x.id===id);
  if(!b) return;
  const e = getTodayEntry();
  if(e.jenisLayanan==='Muat Tebu' && e.muatTipe==='Bibit'){
    if(!e.lokasiMuat){ quickSave('lokasiMuat', b.label); toast('Lokasi Muat diisi: '+b.label); }
    else { quickSave('lokasiBongkar', b.label); toast('Lokasi Bongkar diisi: '+b.label); }
  } else {
    quickSave('lokasi', b.label);
    toast('Lokasi diisi: '+b.label);
  }
  closeModal();
}
function deletePetaBlock(id){
  if(!confirm('Hapus blok ini?')) return;
  PETA_BLOCKS = PETA_BLOCKS.filter(b=>b.id!==id);
  savePetaBlocks();
  renderPeta();
  toast('Blok dihapus');
}
const ALL_EXPORT_HEADERS = ['Tanggal','No Unit','Jenis Layanan','Detail','Lokasi','Absen Berangkat','Absen Pulang','Istirahat','HM Awal','HM Akhir','HM Terpakai','BBM (L)','Lembur (j)','Catatan'];
function slugCol(h){ return h.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }
function openExportSheet(){
  openModal(`
    <div class="mhead"><h2>Export / Cetak Laporan</h2><button class="mclose" onclick="closeModal()">&times;</button></div>
    <div class="section-eyebrow">Periode</div>
    <div class="chk-row"><input type="radio" name="exp-mode" id="exp-mode-month" value="month" checked onchange="updateExpModeUI()"><label for="exp-mode-month" style="margin-left:6px;">Bulan ini</label></div>
    <div class="chk-row"><input type="radio" name="exp-mode" id="exp-mode-all" value="all" onchange="updateExpModeUI()"><label for="exp-mode-all" style="margin-left:6px;">Semua periode</label></div>
    <div class="chk-row"><input type="radio" name="exp-mode" id="exp-mode-custom" value="custom" onchange="updateExpModeUI()"><label for="exp-mode-custom" style="margin-left:6px;">Rentang tanggal custom</label></div>
    <div id="exp-customRange" style="display:none;margin:8px 0;">
      <label class="flabel">Dari tanggal</label><input type="date" id="exp-dateFrom">
      <label class="flabel">Sampai tanggal</label><input type="date" id="exp-dateTo">
    </div>
    <div class="section-eyebrow section-eyebrow-row" style="margin-top:14px;">Kolom yang Dicetak
      <button class="pill-btn sm" type="button" onclick="toggleAllExportCols()">Pilih/Batal Semua</button>
    </div>
    <div class="card card-flat" style="display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;">
      ${ALL_EXPORT_HEADERS.map(h=>`<div class="chk-row"><input type="checkbox" class="exp-col-chk" id="exp-col-${slugCol(h)}" value="${escapeHtml(h)}" checked><label for="exp-col-${slugCol(h)}" style="margin-left:6px;">${escapeHtml(h)}</label></div>`).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="btn-block" style="flex:1;" onclick="doExport('pdf')">&#128196; PDF</button>
      <button class="btn-block outline" style="flex:1;" onclick="doExport('xlsx')">&#128202; Excel</button>
    </div>
  `);
}
function toggleAllExportCols(){
  const boxes = document.querySelectorAll('.exp-col-chk');
  const anyUnchecked = Array.from(boxes).some(b=>!b.checked);
  boxes.forEach(b=>b.checked = anyUnchecked);
}
function getSelectedColumns(){
  return ALL_EXPORT_HEADERS.filter(h=>{
    const el = document.getElementById('exp-col-'+slugCol(h));
    return el ? el.checked : true;
  });
}
function updateExpModeUI(){
  const mode = document.querySelector('input[name="exp-mode"]:checked').value;
  document.getElementById('exp-customRange').style.display = mode==='custom' ? 'block' : 'none';
}
function getExportRows(){
  const mode = document.querySelector('input[name="exp-mode"]:checked').value;
  let rows;
  if(mode==='all'){ rows = ENTRIES.slice(); }
  else if(mode==='custom'){
    const from = document.getElementById('exp-dateFrom').value;
    const to = document.getElementById('exp-dateTo').value;
    rows = ENTRIES.filter(e=>(!from||e.date>=from)&&(!to||e.date<=to));
  } else {
    const mk = todayIso().slice(0,7);
    rows = ENTRIES.filter(e=>e.date.startsWith(mk));
  }
  rows.sort((a,b)=>a.date.localeCompare(b.date));
  const headers = getSelectedColumns();
  const data = rows.map(e=>{
    let detail = '';
    if(e.jenisLayanan==='Antar/Jemput Tenaga') detail = [e.tipeAntar, e.kegiatan].filter(Boolean).join(' / ');
    else if(e.jenisLayanan==='Muat Tebu') detail = [e.muatTipe, e.tonaseKg?e.tonaseKg+' kg':''].filter(Boolean).join(' / ');
    else if(e.jenisLayanan==='Drone') detail = e.droneJenis||'';
    else if(e.jenisLayanan==='Operator') detail = e.shift||'';
    const lokasi = e.jenisLayanan==='Muat Tebu' ? [e.lokasiMuat,e.lokasiBongkar].filter(Boolean).join(' -> ') : (e.lokasi||'');
    const ha=parseFloat(e.hmAwal), hb=parseFloat(e.hmAkhir);
    const hmTerpakai = (!isNaN(ha)&&!isNaN(hb)&&hb>=ha) ? (hb-ha).toFixed(1) : '-';
    return {
      'Tanggal': fmtLabel(e.date), 'No Unit': btLabel(e.btId), 'Jenis Layanan': e.jenisLayanan||'-', 'Detail': detail||'-', 'Lokasi': lokasi||'-',
      'Absen Berangkat': e.absenBerangkat||'-', 'Absen Pulang': e.absenPulang||'-', 'Istirahat': e.istirahat?'':'Lembur',
      'HM Awal': e.hmAwal||'-', 'HM Akhir': e.hmAkhir||'-', 'HM Terpakai': hmTerpakai, 'BBM (L)': e.bbmLiter||'0', 'Lembur (j)': e.lembur||'0', 'Catatan': e.catatan||''
    };
  });
  const totalHm = rows.reduce((s,e)=>{ const a=parseFloat(e.hmAwal), b=parseFloat(e.hmAkhir); return s+((!isNaN(a)&&!isNaN(b)&&b>=a)?(b-a):0); },0);
  const totalLembur = rows.reduce((s,e)=>s+(parseFloat(e.lembur)||0),0);
  return {headers, rows:data, totalHm, totalLembur};
}
function exportFileLabel(){
  const mode = document.querySelector('input[name="exp-mode"]:checked').value;
  if(mode==='all') return 'semua-periode';
  if(mode==='custom'){
    const from = document.getElementById('exp-dateFrom').value || 'awal';
    const to = document.getElementById('exp-dateTo').value || 'akhir';
    return from+'_sd_'+to;
  }
  return todayIso().slice(0,7);
}
const BULAN_NAMA = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function reportTitleLines(){
  const modeEl = document.querySelector('input[name="exp-mode"]:checked');
  const mode = modeEl ? modeEl.value : 'month';
  let periodLabel;
  if(mode==='all'){
    periodLabel = 'Semua Periode';
  } else if(mode==='custom'){
    const from = document.getElementById('exp-dateFrom').value;
    const to = document.getElementById('exp-dateTo').value;
    const fmtShort = (iso)=>{ if(!iso) return '-'; const d=new Date(iso+'T00:00:00'); return d.getDate()+' '+BULAN_NAMA[d.getMonth()]+' '+d.getFullYear(); };
    periodLabel = fmtShort(from)+' s/d '+fmtShort(to);
  } else {
    const d = new Date();
    periodLabel = BULAN_NAMA[d.getMonth()]+'-'+d.getFullYear();
  }
  return ['Laporan Operasional Bulanan', periodLabel, 'Disusun oleh: '+(USER.name||'Pengguna')];
}
async function doExport(fmt){
  const {headers, rows, totalHm, totalLembur} = getExportRows();
  if(headers.length===0){ toast('Pilih minimal satu kolom dulu'); return; }
  if(rows.length===0){ toast('Tidak ada data pada periode ini'); return; }
  const totalRow = headers.map((h,i)=>{
    if(i===0) return 'TOTAL';
    if(h==='HM Terpakai') return totalHm.toFixed(1);
    if(h==='Lembur (j)') return totalLembur.toFixed(1);
    return '';
  });
  if(fmt==='xlsx'){
    if(!window.XLSX){ toast('Library Excel belum siap'); return; }
    const sheetData = [headers, ...rows.map(r=>headers.map(h=>r[h])), totalRow];
    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    ws['!cols'] = headers.map(h=>({wch: Math.max(h.length,12)}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Rekap');
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const result = await saveOrShareBlob(blob, 'rekap-'+exportFileLabel()+'.xlsx');
    toast(result==='shared'?'Excel siap dibagikan':'Excel diunduh');
    closeModal();
    return;
  }
  if(!window.jspdf){ toast('Library PDF belum siap'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape'});
  const titleLines = reportTitleLines();
  doc.setFontSize(14);
  doc.setFont(undefined, 'bold');
  doc.text(titleLines[0], 10, 12);
  doc.setFontSize(11);
  doc.setFont(undefined, 'normal');
  doc.text(titleLines[1], 10, 19);
  doc.text(titleLines[2], 10, 25);
  if(typeof doc.autoTable === 'function'){
    doc.autoTable({
      head: [headers], body: rows.map(r=>headers.map(h=>String(r[h]))),
      foot: [totalRow],
      startY: 31, styles:{fontSize:8, cellPadding:2}, headStyles:{fillColor:[138,90,0]},
      footStyles:{fillColor:[240,230,210], textColor:[30,20,0], fontStyle:'bold'}, theme:'grid'
    });
  }
  const pdfBlob = doc.output('blob');
  const result = await saveOrShareBlob(pdfBlob, 'rekap-'+exportFileLabel()+'.pdf');
  toast(result==='shared'?'PDF siap dibagikan':'PDF diunduh');
  closeModal();
}
function isNativeApp(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=>resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function saveOrShareBlob(blob, filename){
  if(isNativeApp() && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem){
    try{
      const { Filesystem } = window.Capacitor.Plugins;
      const base64 = await blobToBase64(blob);
      const written = await Filesystem.writeFile({ path: filename, data: base64, directory: 'CACHE', recursive: true });
      if(window.Capacitor.Plugins.Share){
        await window.Capacitor.Plugins.Share.share({ title: filename, url: written.uri, dialogTitle: 'Simpan atau bagikan file' });
        return 'shared';
      }
      return 'saved-native';
    }catch(err){
      const msg = err && err.message ? err.message : JSON.stringify(err);
      if(!/cancel/i.test(msg)) alert('Gagal simpan: '+msg);
    }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel='noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return 'downloaded';
  }catch(err){
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    return 'opened';
  }
}

/* ================= TOMBOL BACK SISTEM (ANDROID) ================= */
function anyOverlayOpen(){
  return document.getElementById('modalOverlay').classList.contains('show') || document.getElementById('drawerOverlay').classList.contains('show');
}
function closeAnyOverlay(){
  if(document.getElementById('modalOverlay').classList.contains('show')){ closeModal(); return true; }
  if(document.getElementById('drawerOverlay').classList.contains('show')){ closeDrawer(); return true; }
  return false;
}
function setupBackButton(){
  if(!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App)) return;
  const { App } = window.Capacitor.Plugins;
  App.addListener('backButton', () => {
    if(closeAnyOverlay()) return;
    const activeTab = document.querySelector('#bottomnav button.active');
    if(activeTab && activeTab.dataset.tab !== 'beranda'){
      showScreen('beranda');
      return;
    }
    App.exitApp();
  });
}
