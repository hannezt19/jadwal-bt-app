<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C2333">
<title>Jadwal & HM Terpadu</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --primary:#A8580E; --primary-container:#FFDDB0; --on-primary-container:#3A2200;
    --secondary:#3A5B6E; --secondary-container:#D3E8F0;
    --navy:#1C2333; --navy-2:#262F45;
    --surface:#FFF8F2; --surface-container:#F4EDE3; --surface-container-high:#EDE3D3;
    --on-surface:#211A12; --on-surface-variant:#6F6357; --outline:#E4DACB;
    --danger:#B3261E; --danger-bg:#FBEAE8; --success:#3D6B3E;
    --radius-lg:20px; --radius-md:16px; --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--surface);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--on-surface);}
  button,input,select,textarea{font-family:inherit;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* TOP BAR */
  .topbar{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#fff;cursor:pointer;flex-shrink:0;}
  .icon-btn:active{background:rgba(255,255,255,0.12);}
  .topbar-title{flex:1;min-width:0;}
  .topbar-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#F2C98A;font-weight:700;}
  .topbar-title h1{margin:2px 0 0;font-size:18px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bt-chip{background:var(--primary-container);color:var(--on-primary-container);font-weight:700;font-size:13px;padding:6px 12px;border-radius:100px;flex-shrink:0;border:none;}

  /* SCREENS */
  .screen{display:none;flex:1;overflow-y:auto;padding:16px 16px 100px;}
  .screen.active{display:block;}
  .section-eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface-variant);font-weight:700;margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:center;}
  .section-eyebrow:first-child{margin-top:0;}
  .card{background:#fff;border:1px solid var(--outline);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;}
  .card-flat{background:var(--surface-container);border:none;}
  .row-2{display:flex;gap:12px;}
  .row-2 .card{flex:1;margin-bottom:0;}
  .field-label{font-size:12px;font-weight:600;color:var(--on-surface-variant);margin-bottom:4px;}
  .field-value{font-size:20px;font-weight:700;}
  .field-sub{font-size:12px;color:var(--on-surface-variant);margin-top:2px;}
  .empty-note{text-align:center;color:var(--on-surface-variant);font-size:13px;padding:24px 12px;}

  .hero-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;position:relative;overflow:hidden;}
  .hero-card::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(242,169,59,.22),transparent 70%);}
  .hero-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#F2C98A;font-weight:700;}
  .hero-num{font-size:34px;font-weight:800;margin:6px 0 2px;display:flex;align-items:baseline;gap:8px;}
  .hero-num input{background:transparent;border:none;border-bottom:2px dashed rgba(242,169,59,.5);color:var(--primary-container);font-size:34px;font-weight:800;width:70px;font-family:inherit;}
  .hero-num input:focus{outline:none;border-bottom-style:solid;}
  .hero-num span{font-size:14px;font-weight:600;color:#C9CFDD;}
  .hero-sub{font-size:12.5px;color:#B6BDCE;}

  label.flabel{display:block;font-size:12px;font-weight:700;color:var(--on-surface-variant);margin-bottom:5px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;border:1.5px solid var(--outline);border-radius:12px;padding:11px 12px;font-size:14.5px;
    background:var(--surface-container);color:var(--on-surface);margin-bottom:12px;
  }
  textarea{resize:vertical;min-height:56px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
  .grid2 .full{grid-column:1/-1;}

  .pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary-container);color:var(--on-primary-container);font-size:13px;font-weight:700;padding:9px 16px;border-radius:100px;border:none;cursor:pointer;}
  .btn-filled{width:100%;background:var(--primary);color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:100px;border:none;cursor:pointer;}
  .btn-outline{width:100%;background:transparent;color:var(--primary);font-size:14.5px;font-weight:700;padding:12px;border-radius:100px;border:1.5px solid var(--primary);cursor:pointer;}
  .btn-sm{font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:100px;border:1.5px solid var(--outline);background:#fff;color:var(--on-surface-variant);cursor:pointer;}
  .btn-sm.primary{border-color:transparent;background:var(--primary-container);color:var(--on-primary-container);}

  /* RIWAYAT */
  .hist-tabs{display:flex;gap:8px;margin-bottom:12px;}
  .hist-tab{flex:1;text-align:center;padding:9px;border-radius:100px;font-size:13px;font-weight:700;border:1.5px solid var(--outline);color:var(--on-surface-variant);cursor:pointer;background:#fff;}
  .hist-tab.active-saya{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent;}
  .hist-tab.active-partner{background:var(--secondary-container);color:var(--secondary);border-color:transparent;}
  .hrow{background:#fff;border:1px solid var(--outline);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden;}
  .hrow-head{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;}
  .hrow-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;}
  .hrow-dot.partner{background:var(--secondary);}
  .hrow-main{flex:1;min-width:0;}
  .hrow-date{font-size:14px;font-weight:700;}
  .hrow-sum{font-size:12.5px;color:var(--on-surface-variant);margin-top:1px;}
  .hrow-chev{color:var(--on-surface-variant);transition:transform .2s;flex-shrink:0;}
  .hrow.open .hrow-chev{transform:rotate(180deg);}
  .hrow-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .hrow.open .hrow-body{max-height:900px;border-top:1px solid var(--outline);}
  .hrow-body-inner{padding:14px;}
  .hrow-actions{display:flex;gap:8px;margin-top:2px;}
  .btn-save{flex:1;background:var(--primary);color:#fff;border:none;border-radius:100px;padding:11px;font-weight:700;font-size:13.5px;}
  .btn-del{background:var(--danger-bg);color:var(--danger);border:none;border-radius:100px;padding:11px 16px;font-weight:700;font-size:13.5px;}

  /* NAV */
  .navwrap{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);flex-shrink:0;}
  nav.tabbar{display:flex;background:var(--navy);border-radius:100px;padding:6px;gap:2px;box-shadow:0 8px 24px rgba(20,15,5,.25);}
  nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:none;background:transparent;color:#9099AD;border-radius:100px;cursor:pointer;}
  nav.tabbar button.active{background:rgba(255,255,255,.12);color:#F2C98A;}
  nav.tabbar svg{width:20px;height:20px;}
  nav.tabbar .lbl{font-size:9.5px;font-weight:700;}

  /* DRAWER */
  .scrim{position:fixed;inset:0;background:rgba(15,10,5,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:320px;background:var(--surface);z-index:201;transform:translateX(-105%);transition:transform .25s ease;
    border-radius:0 28px 28px 0;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;overflow-y:auto;}
  .drawer.show{transform:translateX(0);}
  .drawer-profile{display:flex;align-items:center;gap:12px;padding:8px 8px 20px;}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
  .drawer-name{font-weight:700;font-size:15px;}
  .drawer-sub{font-size:12px;color:var(--on-surface-variant);}
  .drawer-group-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-variant);padding:14px 12px 6px;}
  .drawer-item{display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:100px;color:var(--on-surface);font-size:14.5px;font-weight:600;cursor:pointer;}
  .drawer-item:active{background:var(--surface-container-high);}

  /* BOTTOM SHEET (modal umum) */
  .sheet-scrim{position:fixed;inset:0;background:rgba(15,10,5,.45);z-index:210;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-scrim.show{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%);transition:transform .25s ease;max-height:86vh;overflow-y:auto;}
  .sheet-scrim.show .sheet{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--outline);border-radius:100px;margin:8px auto 14px;}
  .sheet-title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .sheet h3{margin:0;font-size:17px;}
  .sheet .dsub{font-size:12.5px;color:var(--on-surface-variant);margin-bottom:14px;}
  .sheet-close{background:none;border:none;font-size:18px;color:var(--on-surface-variant);cursor:pointer;padding:4px;}

  .list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--outline);}
  .list-row:last-child{border-bottom:none;}
  .list-row-name{font-size:14.5px;font-weight:600;}
  .list-row-actions{display:flex;gap:6px;}
  .icon-x{width:30px;height:30px;border-radius:50%;border:none;background:var(--danger-bg);color:var(--danger);font-weight:700;cursor:pointer;}
  .icon-edit{width:30px;height:30px;border-radius:50%;border:none;background:var(--surface-container-high);color:var(--on-surface-variant);font-weight:700;cursor:pointer;}
  .add-row{display:flex;gap:8px;margin-top:10px;}
  .add-row input{margin-bottom:0;flex:1;}
  .add-row button{flex-shrink:0;background:var(--navy);color:#fff;border:none;width:44px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;}

  .chk-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--outline);}
  .chk-row input{width:19px;height:19px;accent-color:var(--primary);}
  .chk-row label{font-size:14.5px;flex:1;}
  .export-fmt{display:flex;gap:10px;margin-top:16px;}
  .fmt-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:16px;border:1.5px solid var(--outline);background:#fff;font-weight:700;font-size:13px;color:var(--on-surface);cursor:pointer;}
  .fmt-btn.pdf{border-color:var(--danger);color:var(--danger);}
  .fmt-btn.csv{border-color:var(--success);color:var(--success);}

  .placeholder-box{text-align:center;padding:60px 20px;color:var(--on-surface-variant);}
  .placeholder-box .pic{font-size:48px;margin-bottom:10px;}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:600;
    opacity:0;transition:all .25s ease;z-index:300;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .kgt-add{width:20px;height:20px;line-height:18px;border-radius:50%;border:none;background:var(--primary-container);color:var(--on-primary-container);font-weight:800;font-size:13px;cursor:pointer;padding:0;}
  .kgt-row{display:flex;gap:6px;margin-bottom:8px;}
  .kgt-row input{margin-bottom:0;flex:1;}
  .kgt-row .kgt-rm{flex-shrink:0;width:32px;border-radius:10px;border:1.5px solid var(--outline);background:#fff;color:var(--danger);font-weight:700;cursor:pointer;}

  .badge-mini{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:100px;margin-left:6px;}
  .badge-saya{background:var(--primary-container);color:var(--on-primary-container);}
  .badge-partner{background:var(--secondary-container);color:var(--secondary);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="icon-btn" onclick="openDrawer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="topbar-title">
      <div class="topbar-eyebrow" id="topEyebrow">Hari Ini</div>
      <h1 id="topTitle">—</h1>
    </div>
    <button class="bt-chip" id="topBtChip" onclick="showScreen('hari')">—</button>
  </div>

  <!-- HARI INI -->
  <div class="screen active" id="screen-hari"></div>
  <!-- PROGRAM -->
  <div class="screen" id="screen-program"></div>
  <!-- PETA -->
  <div class="screen" id="screen-peta"></div>
  <!-- SERVIS -->
  <div class="screen" id="screen-servis"></div>

  <div class="screen" id="screen-rekap"></div>

  <div class="navwrap">
    <nav class="tabbar">
      <button data-tab="hari" onclick="showScreen('hari')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span class="lbl">Hari Ini</span>
      </button>
      <button data-tab="program" onclick="showScreen('program')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span class="lbl">Program</span>
      </button>
      <button data-tab="peta" onclick="showScreen('peta')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5 3 8v13l6-3 6 3 6-3V5l-6 3-6-3Z"/><path d="M9 5v13M15 8v13"/></svg>

      </button>
      <button data-tab="servis" onclick="showScreen('servis')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 1.4 0l1.6-1.6a5 5 0 0 1 0 7.1L9.5 20a3.5 3.5 0 0 1-5-5l8.2-8.2a5 5 0 0 1 7.1 0"/></svg>
        <span class="lbl">Servis</span>
      </button>
      <button data-tab="rekap" onclick="showScreen('rekap')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span class="lbl">Rekap</span>
      </button>
    </nav>
  </div>

  <div class="scrim" id="scrim" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-profile">
      <div class="avatar" id="drawerAvatar">?</div>
      <div>
        <div class="drawer-name" id="drawerName">—</div>
        <div class="drawer-sub" id="drawerSub">—</div>
      </div>
    </div>
    <div class="drawer-group-label">Akun & Data Utama</div>
    <div class="drawer-item" onclick="closeDrawer();openSettingSheet()">⚙️&nbsp; Setting Akun</div>
    <div class="drawer-item" onclick="closeDrawer();openBtPartnerSheet()">🚚&nbsp; Kelola BT & Partner</div>
    <div class="drawer-item" onclick="closeDrawer();openJenisSheet()">🧾&nbsp; Kelola Jenis Layanan</div>
    <div class="drawer-item" onclick="closeDrawer();openBlokSheet()">📍&nbsp; Kelola Blok/Petak (Rute)</div>
    <div class="drawer-item" onclick="closeDrawer();openLiburSheet()">📅&nbsp; Kelola Hari Libur</div>
    <div class="drawer-item" onclick="closeDrawer();showScreen('peta')">🗺️&nbsp; Buka Peta / Impor Vektor</div>
    <div class="drawer-group-label">Lainnya</div>
    <div class="drawer-item" onclick="closeDrawer();showScreen('rekap');setTimeout(openExportSheet,300)">📤&nbsp; Export Data</div>
  </div>

  <div id="modalHost"></div>
  <div class="toast" id="toast"></div>

<style>
  #petaMap{width:100%;height:340px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--outline);margin-bottom:12px;}
  .peta-upload{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-container);border:1.5px dashed var(--outline);border-radius:var(--radius-md);padding:14px;font-size:13px;font-weight:700;color:var(--on-surface-variant);cursor:pointer;margin-bottom:12px;}
  .peta-upload input{display:none;}
  .peta-selected{background:var(--primary-container);color:var(--on-primary-container);border-radius:var(--radius-md);padding:12px 14px;font-size:14px;font-weight:700;margin-bottom:12px;}
</style>
<script>
/* ============ STORAGE ============ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ /* penuh/diblokir, abaikan */ } }
};
let USER = LS.get('mrg_user', {name:'', mainBt:''});
let BT_CODES = LS.get('mrg_bt', [{id:'bt12',label:'BT.12'},{id:'bt13',label:'BT.13'}]);
let PARTNERS = LS.get('mrg_partners', []);
let LIBUR = LS.get('mrg_libur', []); // [{date,label}]
let ENTRIES = LS.get('mrg_entries', []); // catatan harian gabungan
let SERVIS = LS.get('mrg_servis', []);
if(!USER.mainBt && BT_CODES[0]) USER.mainBt = BT_CODES[0].id;

function saveUser(){ LS.set('mrg_user', USER); }
function saveBt(){ LS.set('mrg_bt', BT_CODES); }
function savePartners(){ LS.set('mrg_partners', PARTNERS); }
function saveLibur(){ LS.set('mrg_libur', LIBUR); }
function saveEntries(){ LS.set('mrg_entries', ENTRIES); }
function saveServis(){ LS.set('mrg_servis', SERVIS); }

/* ============ HELPERS ============ */
const DAY_NAMES = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jumat",'Sabtu'];
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONTH_NAMES_FULL = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const NORMAL_HOURS = {1:7,2:7,3:7,4:7,5:6.5,6:5.5,0:0};
let JENIS_KATEGORI = LS.get('mrg_jenis', ['Angkutan Tenaga Kerja','Angkutan Tebu','Layanan Drone','Lainnya']);
function saveJenis(){ LS.set('mrg_jenis', JENIS_KATEGORI); }

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dow(iso){ return new Date(iso+'T00:00:00').getDay(); }
function monthKey(iso){ return iso.slice(0,7); }
function fmtLabel(iso){ const d=new Date(iso+'T00:00:00'); return DAY_NAMES[d.getDay()]+', '+d.getDate()+' '+MONTH_NAMES[d.getMonth()]+' '+d.getFullYear(); }
function isHoliday(iso){ return LIBUR.some(h=>h.date===iso); }
function btLabel(id){ const b=BT_CODES.find(x=>x.id===id); return b?b.label:'—'; }
function toMinutes(t){ if(!t) return null; const clean=t.replace(/[^0-9:.]/g,'').replace('.',':'); const parts=clean.split(':'); if(parts.length<2) return null; const h=parseInt(parts[0],10),m=parseInt(parts[1],10); if(isNaN(h)||isNaN(m)) return null; return h*60+m; }
function fmtHoursNum(mins){ return Math.round((mins/60)*10)/10; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('show'),2200); }

function computeOT(e){
  const isFullOt = dow(e.date)===0 || isHoliday(e.date);
  const t1 = toMinutes(e.s1Time), t5 = toMinutes(e.s5Time);
  let span = (t1!==null && t5!==null) ? Math.max(0, t5-t1) : 0;
  const rs = toMinutes(e.istMulai), re = toMinutes(e.istSelesai);
  let restMin = (rs!==null && re!==null) ? Math.max(0, re-rs) : 0;
  if(e.istLembur) restMin = 0;
  const totalMin = Math.max(0, span-restMin);
  const normalMin = isFullOt ? 0 : (NORMAL_HOURS[dow(e.date)]||0)*60;
  let otMin = isFullOt ? totalMin : Math.max(0, totalMin-normalMin);
  if(e.otOverride !== null && e.otOverride !== undefined && e.otOverride !== '') otMin = Number(e.otOverride)*60;
  return {totalMin, otMin, isFullOt};
}
function hmPakai(e){ const a=parseFloat(e.hmAwal), b=parseFloat(e.hmAkhir); if(isNaN(a)||isNaN(b)) return 0; return Math.max(0, b-a); }

/* ============ PETA ============ */
let PETA_GEOJSON = LS.get('mrg_peta_geojson', null);
let petaLeafletMap = null;
let petaSelected = null; // {label}
function savePetaGeojson(){ LS.set('mrg_peta_geojson', PETA_GEOJSON); }
function petaBlokLabel(props){
  if(!props) return 'Blok';
  const keys = Object.keys(props);
  const guess = keys.find(k=>/blok|petak|no|nama|name|id/i.test(k));
  return guess ? String(props[guess]) : (keys.length ? String(props[keys[0]]) : 'Blok');
}
function renderPeta(){
  const host = document.getElementById('screen-peta');
  host.innerHTML = `
    <div class="section-eyebrow">Peta Kebun</div>
    <label class="peta-upload" for="petaFileInput">📤 Impor Peta Vektor (GeoJSON)
      <input type="file" id="petaFileInput" accept=".geojson,.json" onchange="handlePetaUpload(event)">
    </label>
    <div id="petaMap"></div>
    <div id="petaSelWrap"></div>
    <div class="dsub" style="margin:0 0 8px;">Ketuk petak/blok di peta untuk memilihnya. Nomor blok dari file vektor otomatis tersimpan sebagai database dan bisa dipakai ulang di kolom Keterangan/Rute (juga bisa ditambah manual lewat menu ☰ → Kelola Blok/Petak).</div>
  `;
  setTimeout(initPetaMap, 30);
}
function initPetaMap(){
  const el = document.getElementById('petaMap');
  if(!el || typeof L==='undefined') { if(el) el.innerHTML='<div class="empty-note">Peta gagal dimuat (perlu koneksi internet).</div>'; return; }
  if(petaLeafletMap){ petaLeafletMap.remove(); petaLeafletMap=null; }
  petaLeafletMap = L.map('petaMap');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(petaLeafletMap);
  let bounds = null;
  if(PETA_GEOJSON){
    const layer = L.geoJSON(PETA_GEOJSON, {
      style:{color:'#A8580E', weight:2, fillColor:'#F2C98A', fillOpacity:.35},
      onEachFeature:(feature, lyr)=>{
        const label = petaBlokLabel(feature.properties);
        lyr.bindTooltip(label, {permanent:false});
        lyr.on('click', ()=>selectPetaBlok(label));
      }
    }).addTo(petaLeafletMap);
    bounds = layer.getBounds();
  }
  if(bounds && bounds.isValid()) petaLeafletMap.fitBounds(bounds, {padding:[16,16]});
  else petaLeafletMap.setView([-4.9,105.2], 12); // fallback: area default kebun
}
function handlePetaUpload(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const gj = JSON.parse(reader.result);
      PETA_GEOJSON = gj; savePetaGeojson();
      const feats = gj.features || (gj.type==='Feature' ? [gj] : []);
      let added = 0;
      feats.forEach(f=>{
        const label = petaBlokLabel(f.properties);
        if(label && !BLOK_LIST.some(b=>b.label===label)){ BLOK_LIST.push({id:uid(), label, source:'peta'}); added++; }
      });
      saveBlok(); refreshBlokDatalist();
      toast(added>0 ? added+' blok dari peta ditambahkan ke database' : 'Peta dimuat');
      renderPeta();
    }catch(err){ toast('File bukan GeoJSON yang valid'); }
  };
  reader.readAsText(file);
}
function selectPetaBlok(label){
  petaSelected = label;
  document.getElementById('petaSelWrap').innerHTML = `
    <div class="peta-selected">📍 ${label}
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn-sm primary" onclick="applyPetaBlokToRute()">Isi ke Rute Hari Ini</button>
      </div>
    </div>`;
}
function applyPetaBlokToRute(){
  if(!petaSelected) return;
  if(!BLOK_LIST.some(b=>b.label===petaSelected)){ BLOK_LIST.push({id:uid(), label:petaSelected, source:'peta'}); saveBlok(); refreshBlokDatalist(); }
  window._todayEntry = window._todayEntry || entryForToday() || {};
  showScreen('hari');
  setTimeout(()=>quickSaveField('jenisKet', petaSelected), 30);
  toast('Rute diisi dari peta');
}

/* ============ REKAP ============ */
let rekapMonth = todayIso().slice(0,7);
const SERVICE_INTERVAL_HM = 240;
function lastServisForBt(btId){
  const list = SERVIS.filter(s=>s.btId===btId).sort((a,b)=>b.date.localeCompare(a.date));
  return list[0] || null;
}
function currentHmForBt(btId){
  const vals = ENTRIES.filter(e=>e.btId===btId && e.hmAkhir!=='' && e.hmAkhir!=null).map(e=>parseFloat(e.hmAkhir)).filter(v=>!isNaN(v));
  return vals.length ? Math.max(...vals) : null;
}
function hmServiceStatus(btId){
  const last = lastServisForBt(btId);
  const current = currentHmForBt(btId);
  const baseHm = last ? parseFloat(last.hm)||0 : null;
  const sisa = (baseHm!==null && current!==null) ? Math.max(0, current-baseHm) : null;
  return {last, current, baseHm, sisa};
}
function renderRekap(){
  const host = document.getElementById('screen-rekap');
  const monthEntries = ENTRIES.filter(e=>monthKey(e.date)===rekapMonth);
  const totalHm = monthEntries.reduce((s,e)=>s+hmPakai(e),0);
  const totalBbm = monthEntries.reduce((s,e)=>s+(parseFloat(e.bbmLiter)||0),0);
  const totalOt = monthEntries.reduce((s,e)=>s+computeOT(e).otMin,0)/60;
  const ratio = totalHm>0 ? (totalBbm/totalHm).toFixed(2) : '0.00';
  const list = monthEntries.filter(e=>e.ownerType===histFilter).sort((a,b)=>b.date.localeCompare(a.date));

  const mainBt = USER.mainBt;
  const mainBtEntriesMonth = monthEntries.filter(e=>e.btId===mainBt);
  const mainBtBbmMonth = mainBtEntriesMonth.reduce((s,e)=>s+(parseFloat(e.bbmLiter)||0),0);
  const svc = hmServiceStatus(mainBt);
  const pct = svc.sisa!==null ? Math.min(100, Math.round((svc.sisa/SERVICE_INTERVAL_HM)*100)) : null;
  const warn = svc.sisa!==null && svc.sisa>=SERVICE_INTERVAL_HM;

  host.innerHTML = `
    <div class="section-eyebrow">Ringkasan
      <input type="month" value="${rekapMonth}" style="width:auto;margin:0;padding:6px 10px;font-size:12.5px;" onchange="rekapMonth=this.value;renderRekap()">
    </div>
    <div class="row-2" style="margin-bottom:12px;">
      <div class="card"><div class="field-label">Total HM</div><div class="field-value">${totalHm.toFixed(1)}</div></div>
      <div class="card"><div class="field-label">Total BBM</div><div class="field-value">${totalBbm.toFixed(0)} L</div></div>
    </div>
    <div class="row-2" style="margin-bottom:12px;">
      <div class="card"><div class="field-label">Rasio L/HM</div><div class="field-value" style="font-size:17px;">${ratio}</div></div>
      <div class="card"><div class="field-label">Total Lembur</div><div class="field-value" style="font-size:17px;">${totalOt.toFixed(1)}j</div></div>
    </div>

    <div class="section-eyebrow">Filter BT Saya — ${btLabel(mainBt)}</div>
    <div class="card">
      <div class="row-2" style="margin-bottom:2px;">
        <div><div class="field-label">BBM bulan ini (${btLabel(mainBt)})</div><div class="field-value" style="font-size:19px;">${mainBtBbmMonth.toFixed(0)} L</div></div>
        <div><div class="field-label">HM Sekarang</div><div class="field-value" style="font-size:19px;">${svc.current!==null?svc.current.toFixed(1):'—'}</div></div>
      </div>
    </div>
    <div class="card" style="${warn?'border-color:var(--danger);':''}">
      <div class="field-label">Progres Menuju Servis Berkala (${SERVICE_INTERVAL_HM} jam HM)</div>
      ${svc.baseHm===null ? `<div class="field-sub" style="margin-top:6px;">Belum ada catatan servis untuk ${btLabel(mainBt)}. Tambahkan servis terakhir agar progres bisa dihitung.</div>` : `
        <div style="background:var(--surface-container-high);border-radius:100px;height:10px;margin:10px 0 6px;overflow:hidden;">
          <div style="height:100%;border-radius:100px;width:${pct}%;background:${warn?'var(--danger)':'var(--primary)'};"></div>
        </div>
        <div class="field-sub">${svc.sisa.toFixed(1)} jam terpakai sejak servis terakhir (${fmtLabel(svc.last.date)}, HM ${svc.baseHm})${warn?' — sudah melewati batas, segera servis!':''}</div>
      `}
      <button class="btn-outline" style="margin-top:12px;" onclick="openServisForm('${mainBt}', ${svc.current!==null?svc.current:'null'})">🔧 Catat Servis Berkala (Reset)</button>
    </div>

    <div class="section-eyebrow">Riwayat</div>
    <div class="hist-tabs">
      <div class="hist-tab ${histFilter==='saya'?'active-saya':''}" onclick="setHistFilter('saya')">🟠 Saya</div>
      <div class="hist-tab ${histFilter==='partner'?'active-partner':''}" onclick="setHistFilter('partner')">🔵 Partner</div>
    </div>
    ${renderHistoryList(list)}
    <button class="pill-btn" style="margin:16px 0 4px;width:100%;justify-content:center;" onclick="openExportSheet()">⬇ Export Laporan</button>
  `;
}

/* ============ EXPORT ============ */
const EXPORT_COLS = [
  {key:'date', label:'Tanggal', checked:true},
  {key:'btId', label:'Kode BT', checked:true},
  {key:'hm', label:'HM Awal / Akhir', checked:true},
  {key:'bbm', label:'BBM (liter)', checked:true},
  {key:'jenis', label:'Jenis Layanan & Rute', checked:false},
  {key:'ot', label:'Jam Lembur', checked:true},
  {key:'catatan', label:'Catatan', checked:false},
];
function openExportSheet(){
  document.getElementById('modalHost').innerHTML = `
    <div class="sheet-scrim show" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row"><h3>Export Laporan</h3><button class="sheet-close" onclick="closeModal()">✕</button></div>
        <div class="dsub">Bulan ${MONTH_NAMES_FULL[parseInt(rekapMonth.split('-')[1])-1]} ${rekapMonth.split('-')[0]} · pilih kolom yang ingin disertakan</div>
        ${EXPORT_COLS.map(c=>`<div class="chk-row"><input type="checkbox" id="exp-${c.key}" ${c.checked?'checked':''}><label for="exp-${c.key}">${c.label}</label></div>`).join('')}
        <div class="export-fmt">
          <button class="fmt-btn pdf" onclick="doExport('pdf')">📄 PDF</button>
          <button class="fmt-btn csv" onclick="doExport('csv')">📊 Excel (CSV)</button>
        </div>
      </div>
    </div>`;
}
function sanitizePdfText(s){
  return String(s)
    .replace(/→/g, '->')
    .replace(/—/g, '-')
    .replace(/–/g, '-')
    .replace(/[’‘]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/•/g, '-');
}
function getExportRows(){
  const cols = EXPORT_COLS.filter(c=>document.getElementById('exp-'+c.key).checked);
  const monthEntries = ENTRIES.filter(e=>monthKey(e.date)===rekapMonth).sort((a,b)=>a.date.localeCompare(b.date));
  const rows = monthEntries.map(e=>{
    const ot = computeOT(e); const o={};
    cols.forEach(c=>{
      if(c.key==='date') o[c.label]=fmtLabel(e.date);
      if(c.key==='btId') o[c.label]=btLabel(e.btId)+(e.ownerType==='partner'?' ('+e.ownerName+')':'');
      if(c.key==='hm') o[c.label]=(e.hmAwal||'-')+' -> '+(e.hmAkhir||'-')+' ('+hmPakai(e)+' jam)';
      if(c.key==='bbm') o[c.label]=(e.bbmLiter||0)+' L';
      if(c.key==='jenis') o[c.label]=(e.jenisKategori||'-')+' - '+(e.jenisKet||'-');
      if(c.key==='ot') o[c.label]=fmtHoursNum(ot.otMin)+' jam';
      if(c.key==='catatan') o[c.label]=e.catatan||'-';
    });
    return o;
  });
  return {cols, rows};
}
function doExport(fmt){
  const {cols, rows} = getExportRows();
  if(rows.length===0){ toast('Tidak ada data di bulan ini'); return; }
  const headers = cols.map(c=>c.label);
  if(fmt==='csv'){
    let csv = headers.join(';')+'\n';
    rows.forEach(r=>{ csv += headers.map(h=>'"'+String(r[h]).replace(/"/g,'""')+'"').join(';')+'\n'; });
    const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'rekap-'+rekapMonth+'.csv'; a.click();
    toast('Excel (CSV) diunduh'); closeModal(); return;
  }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont('helvetica', 'normal');
    const pageWidth = doc.internal.pageSize.getWidth();
    const marginX = 14;
    const usableWidth = pageWidth - marginX*2;
    doc.setFontSize(14);
    doc.text(sanitizePdfText('Laporan Bulanan - '+rekapMonth), marginX, 16);
    let y = 26;
    rows.forEach((r,i)=>{
      doc.setFontSize(9);
      doc.setFont('helvetica','bold');
      const headLine = sanitizePdfText((r[headers[0]]||'')+'  |  '+(headers[1]?(headers[1]+': '+r[headers[1]]):''));
      const headSplit = doc.splitTextToSize(headLine, usableWidth);
      doc.text(headSplit, marginX, y); y += headSplit.length*4.6;
      doc.setFont('helvetica','normal');
      headers.slice(2).forEach(h=>{
        const line = sanitizePdfText(h+': '+r[h]);
        const split = doc.splitTextToSize(line, usableWidth);
        doc.text(split, marginX, y); y += split.length*4.6;
      });
      y += 4;
      if(y > 280){ doc.addPage(); y=16; }
    });
    doc.save('rekap-'+rekapMonth+'.pdf');
    toast('PDF diunduh'); closeModal();
  }catch(err){ toast('Gagal membuat PDF'); }
}
