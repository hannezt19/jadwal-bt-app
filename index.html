<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C2333">
<title>Jadwal & HM Terpadu</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --primary:#A8580E; --primary-container:#FFDDB0; --on-primary-container:#3A2200;
    --secondary:#3A5B6E; --secondary-container:#D3E8F0;
    --navy:#1C2333; --navy-2:#262F45;
    --surface:#FFF8F2; --surface-container:#F4EDE3; --surface-container-high:#EDE3D3;
    --on-surface:#211A12; --on-surface-variant:#6F6357; --outline:#E4DACB;
    --danger:#B3261E; --danger-bg:#FBEAE8; --success:#3D6B3E;
    --radius-lg:20px; --radius-md:16px; --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--surface);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--on-surface);}
  button,input,select,textarea{font-family:inherit;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* TOP BAR */
  .topbar{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#fff;cursor:pointer;flex-shrink:0;}
  .icon-btn:active{background:rgba(255,255,255,0.12);}
  .topbar-title{flex:1;min-width:0;}
  .topbar-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#F2C98A;font-weight:700;}
  .topbar-title h1{margin:2px 0 0;font-size:18px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bt-chip{background:var(--primary-container);color:var(--on-primary-container);font-weight:700;font-size:13px;padding:6px 12px;border-radius:100px;flex-shrink:0;border:none;}

  /* SCREENS */
  .screen{display:none;flex:1;overflow-y:auto;padding:16px 16px 100px;}
  .screen.active{display:block;}
  .section-eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface-variant);font-weight:700;margin:20px 2px 10px;display:block;}
  .section-eyebrow:first-child{margin-top:0;}
  .section-eyebrow-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .card{background:#fff;border:1px solid var(--outline);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;}
  .card-flat{background:var(--surface-container);border:none;}
  .row-2{display:flex;gap:12px;}
  .row-2 .card{flex:1;margin-bottom:0;}
  .field-label{font-size:12px;font-weight:600;color:var(--on-surface-variant);margin-bottom:4px;}
  .field-value{font-size:20px;font-weight:700;}
  .field-sub{font-size:12px;color:var(--on-surface-variant);margin-top:2px;}
  .empty-note{text-align:center;color:var(--on-surface-variant);font-size:13px;padding:24px 12px;}

  .hero-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;position:relative;overflow:hidden;}
  .hero-card::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(242,169,59,.22),transparent 70%);}
  .hero-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#F2C98A;font-weight:700;}
  .hero-num{font-size:34px;font-weight:800;margin:6px 0 2px;display:flex;align-items:baseline;gap:8px;}
  .hero-num input{background:transparent;border:none;border-bottom:2px dashed rgba(242,169,59,.5);color:var(--primary-container);font-size:34px;font-weight:800;width:70px;font-family:inherit;}
  .hero-num input:focus{outline:none;border-bottom-style:solid;}
  .hero-num span{font-size:14px;font-weight:600;color:#C9CFDD;}
  .hero-sub{font-size:12.5px;color:#B6BDCE;}

  label.flabel{display:block;font-size:14.5px;font-weight:700;color:var(--on-surface-variant);margin-bottom:6px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;border:1.5px solid var(--outline);border-radius:14px;padding:14px;font-size:17px;min-height:54px;
    background:var(--surface-container);color:var(--on-surface);margin-bottom:12px;
  }
  textarea{resize:vertical;min-height:56px;}
  .grid2{display:grid;grid-template-columns:1fr;gap:10px 12px;}
  .grid2 .full{grid-column:1/-1;}
  @media (min-width:400px){ .grid2{grid-template-columns:1fr 1fr;} }

  .pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary-container);color:var(--on-primary-container);font-size:13px;font-weight:700;padding:9px 16px;border-radius:100px;border:none;cursor:pointer;}
  .btn-filled{width:100%;background:var(--primary);color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:100px;border:none;cursor:pointer;}
  .btn-outline{width:100%;background:transparent;color:var(--primary);font-size:14.5px;font-weight:700;padding:12px;border-radius:100px;border:1.5px solid var(--primary);cursor:pointer;}
  .btn-sm{font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:100px;border:1.5px solid var(--outline);background:#fff;color:var(--on-surface-variant);cursor:pointer;}
  .btn-sm.primary{border-color:transparent;background:var(--primary-container);color:var(--on-primary-container);}

  /* RIWAYAT */
  .hist-tabs{display:flex;gap:8px;margin-bottom:12px;}
  .hist-tab{flex:1;text-align:center;padding:9px;border-radius:100px;font-size:13px;font-weight:700;border:1.5px solid var(--outline);color:var(--on-surface-variant);cursor:pointer;background:#fff;}
  .hist-tab.active-saya{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent;}
  .hist-tab.active-partner{background:var(--secondary-container);color:var(--secondary);border-color:transparent;}
  .hrow{background:#fff;border:1px solid var(--outline);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden;}
  .hrow-head{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;}
  .hrow-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;}
  .hrow-dot.partner{background:var(--secondary);}
  .hrow-main{flex:1;min-width:0;}
  .hrow-date{font-size:14px;font-weight:700;}
  .hrow-sum{font-size:12.5px;color:var(--on-surface-variant);margin-top:1px;}
  .hrow-chev{color:var(--on-surface-variant);transition:transform .2s;flex-shrink:0;}
  .hrow.open .hrow-chev{transform:rotate(180deg);}
  .hrow-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .hrow.open .hrow-body{max-height:900px;border-top:1px solid var(--outline);}
  .hrow-body-inner{padding:14px;}
  .hrow-actions{display:flex;gap:8px;margin-top:2px;}
  .btn-save{flex:1;background:var(--primary);color:#fff;border:none;border-radius:100px;padding:11px;font-weight:700;font-size:13.5px;}
  .btn-del{background:var(--danger-bg);color:var(--danger);border:none;border-radius:100px;padding:11px 16px;font-weight:700;font-size:13.5px;}

  .box-truck-table{width:100%;border-collapse:collapse;margin-top:4px;}
  .box-truck-table th,.box-truck-table td{border:1px solid var(--outline);padding:8px 10px;font-size:12.5px;text-align:left;white-space:normal;word-break:break-word;}
  .box-truck-table th{background:var(--navy);color:#fff;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;}
  .box-truck-table tr:nth-child(even) td{background:var(--surface-container);}

  /* NAV */
  .navwrap{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;z-index:50;padding:0;background:transparent;}
  .screen{padding-bottom:110px;}
  nav.tabbar{display:flex;background:var(--navy);border-radius:100px;padding:6px;gap:2px;box-shadow:0 8px 24px rgba(20,15,5,.25);}
  nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:none;background:transparent;color:#9099AD;border-radius:100px;cursor:pointer;}
  nav.tabbar button.active{background:rgba(255,255,255,.12);color:#F2C98A;}
  nav.tabbar svg{width:20px;height:20px;}
  nav.tabbar .lbl{font-size:9.5px;font-weight:700;}

  /* DRAWER */
  .scrim{position:fixed;inset:0;background:rgba(15,10,5,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:320px;background:var(--surface);z-index:201;transform:translateX(-105%);transition:transform .25s ease;
    border-radius:0 28px 28px 0;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;overflow-y:auto;}
  .drawer.show{transform:translateX(0);}
  .drawer-profile{display:flex;align-items:center;gap:12px;padding:8px 8px 20px;}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
  .drawer-name{font-weight:700;font-size:15px;}
  .drawer-sub{font-size:12px;color:var(--on-surface-variant);}
  .drawer-group-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-variant);padding:14px 12px 6px;}
  .drawer-item{display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:100px;color:var(--on-surface);font-size:14.5px;font-weight:600;cursor:pointer;}
  .drawer-item:active{background:var(--surface-container-high);}

  /* BOTTOM SHEET (modal umum) */
  .sheet-scrim{position:fixed;inset:0;background:rgba(15,10,5,.45);z-index:210;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-scrim.show{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%);transition:transform .25s ease;max-height:86vh;overflow-y:auto;}
  .sheet-scrim.show .sheet{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--outline);border-radius:100px;margin:8px auto 14px;}
  .sheet-title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .sheet h3{margin:0;font-size:17px;}
  .sheet .dsub{font-size:12.5px;color:var(--on-surface-variant);margin-bottom:14px;}
  .sheet-close{background:none;border:none;font-size:18px;color:var(--on-surface-variant);cursor:pointer;padding:4px;}

  .list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--outline);}
  .list-row:last-child{border-bottom:none;}
  .list-row-name{font-size:14.5px;font-weight:600;}
  .list-row-actions{display:flex;gap:6px;}
  .icon-x{width:30px;height:30px;border-radius:50%;border:none;background:var(--danger-bg);color:var(--danger);font-weight:700;cursor:pointer;}
  .icon-edit{width:30px;height:30px;border-radius:50%;border:none;background:var(--surface-container-high);color:var(--on-surface-variant);font-weight:700;cursor:pointer;}
  .add-row{display:flex;gap:8px;margin-top:10px;}
  .add-row input{margin-bottom:0;flex:1;}
  .add-row button{flex-shrink:0;background:var(--navy);color:#fff;border:none;width:44px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;}

  .chk-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--outline);}
  .chk-row input{width:19px;height:19px;accent-color:var(--primary);}
  .chk-row label{font-size:14.5px;flex:1;}
  .export-fmt{display:flex;gap:10px;margin-top:16px;}
  .fmt-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:16px;border:1.5px solid var(--outline);background:#fff;font-weight:700;font-size:13px;color:var(--on-surface);cursor:pointer;}
  .fmt-btn.pdf{border-color:var(--danger);color:var(--danger);}
  .fmt-btn.csv{border-color:var(--success);color:var(--success);}

  .placeholder-box{text-align:center;padding:60px 20px;color:var(--on-surface-variant);}
  .placeholder-box .pic{font-size:48px;margin-bottom:10px;}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:600;
    opacity:0;transition:all .25s ease;z-index:300;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .kgt-add{width:20px;height:20px;line-height:18px;border-radius:50%;border:none;background:var(--primary-container);color:var(--on-primary-container);font-weight:800;font-size:13px;cursor:pointer;padding:0;}
  .kgt-row{display:flex;gap:6px;margin-bottom:8px;}
  .kgt-row input{margin-bottom:0;flex:1;}
  .kgt-row .kgt-rm{flex-shrink:0;width:32px;border-radius:10px;border:1.5px solid var(--outline);background:#fff;color:var(--danger);font-weight:700;cursor:pointer;}

  .badge-mini{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:100px;margin-left:6px;}
  .badge-saya{background:var(--primary-container);color:var(--on-primary-container);}
  .badge-partner{background:var(--secondary-container);color:var(--secondary);}
</style>
</head>

const MONTH_NAMES_FULL = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const NORMAL_HOURS = {1:7,2:7,3:7,4:7,5:6.5,6:5.5,0:0};

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function enumerateDates(start, end){
  const dates = []; let cur = new Date(start+'T00:00:00'); const last = new Date((end||start)+'T00:00:00');
  if(last < cur) return [start];
  while(cur <= last){
    dates.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'));
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}
function todayIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dow(iso){ return new Date(iso+'T00:00:00').getDay(); }
function monthKey(iso){ return iso.slice(0,7); }
function fmtLabel(iso){ const d=new Date(iso+'T00:00:00'); return DAY_NAMES[d.getDay()]+', '+d.getDate()+' '+MONTH_NAMES[d.getMonth()]+' '+d.getFullYear(); }
function isHoliday(iso){ return LIBUR.some(h=>h.date===iso); }
function btLabel(id){ const b=BT_CODES.find(x=>x.id===id); return b?b.label:'—'; }
function toMinutes(t){
  if(!t) return null;
  const clean = t.trim().replace(/[^0-9:.]/g,'').replace('.',':');
  let h, m;
  if(clean.includes(':')){
    const parts = clean.split(':');
    if(parts.length<2) return null;
    h = parseInt(parts[0],10); m = parseInt(parts[1],10);
  } else if(clean.length===3 || clean.length===4){
    // format tanpa pemisah, mis. "0700" -> 07:00, "730" -> 07:30
    const padded = clean.padStart(4,'0');
    h = parseInt(padded.slice(0,2),10); m = parseInt(padded.slice(2,4),10);
  } else if(clean.length<=2){
    h = parseInt(clean,10); m = 0;
  } else {
    return null;
  }
  if(isNaN(h)||isNaN(m)||h>23||m>59) return null;
  return h*60+m;
}
function fmtHoursNum(mins){ return Math.round((mins/60)*10)/10; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('show'),2200); }

function computeOT(e){
  const isFullOt = dow(e.date)===0 || isHoliday(e.date);
  const t1 = toMinutes(e.s1Time), t5 = toMinutes(e.s5Time);
  let span = (t1!==null && t5!==null) ? Math.max(0, t5-t1) : 0;
  const rs = toMinutes(e.istMulai), re = toMinutes(e.istSelesai);
  let restMin = (rs!==null && re!==null) ? Math.max(0, re-rs) : 0;
  if(e.istLembur) restMin = 0;
  const totalMin = Math.max(0, span-restMin);
  const normalMin = isFullOt ? 0 : (NORMAL_HOURS[dow(e.date)]||0)*60;
  let otMin = isFullOt ? totalMin : Math.max(0, totalMin-normalMin);
  if(e.otOverride !== null && e.otOverride !== undefined && e.otOverride !== '') otMin = Number(e.otOverride)*60;
  return {totalMin, otMin, isFullOt};
}
function hmPakai(e){ const a=parseFloat(e.hmAwal), b=parseFloat(e.hmAkhir); if(isNaN(a)||isNaN(b)) return 0; return Math.max(0, b-a); }

function calcOtPreviewMin(dateStr, s1, s5){
  if(!dateStr) return 0;
  const isFullOt = dow(dateStr)===0 || isHoliday(dateStr);
  const t1 = toMinutes(s1), t5 = toMinutes(s5);
  let span = (t1!==null && t5!==null) ? Math.max(0, t5-t1) : 0;
  let restMin = isFullOt ? 0 : 150; // asumsi istirahat standar 11.00-13.30
  const totalMin = Math.max(0, span-restMin);
  const normalMin = isFullOt ? 0 : (NORMAL_HOURS[dow(dateStr)]||0)*60;
  return isFullOt ? totalMin : Math.max(0, totalMin-normalMin);
}
function updateProgramOtPreview(){
  if(window._efOtManual) return;
  const dateEl = document.getElementById('efDate'), s1El = document.getElementById('efS1'), s5El = document.getElementById('efS5');
  if(!dateEl || !s1El || !s5El) return;
  const otMin = calcOtPreviewMin(dateEl.value, s1El.value, s5El.value);
  const otField = document.getElementById('efOt');
  if(otField) otField.value = otMin>0 ? fmtHoursNum(otMin) : '';
}

function saveEntryForm(id){
  const sopirVal = document.getElementById('efSopir').value;
  if(!sopirVal){ toast('Pilih sopir dulu'); return; }
  const partnerObj = PARTNERS.find(p=>p.id===sopirVal);
  const ownerType = 'partner';
  const partnerId = sopirVal;
  const dateStart = document.getElementById('efDate').value;
  const dateEnd = document.getElementById('efDateEnd').value || dateStart;
  const dates = enumerateDates(dateStart, dateEnd);
  const btId = document.getElementById('efBt').value;
  const jenisKategori = document.getElementById('efJenisKategori').value;
  const gv = elId => document.getElementById(elId) ? document.getElementById(elId).value : '';
  const base = {
    btId, ownerType, partnerId,
    ownerName: ownerType==='saya' ? (USER.name||'Saya') : (partnerObj?partnerObj.name:'Sopir'),
    s1Time: gv('efS1'), s5Time: gv('efS5'),
    istMulai:'11.00', istSelesai:'13.30', istLembur:false,
    otOverride: gv('efOt')===''?null:gv('efOt'),
    hmAwal:'', hmAkhir:'', bbmLiter:'',
    jenisKategori,
    antarTipe: gv('efAntarTipe'), antarKegiatan: gv('efAntarKegiatan'),
    muatTipe: gv('efMuatTipe'), tonaseKg: gv('efTonase'),
    lokasiMuat: gv('efLokasiMuat'), lokasiBongkar: gv('efLokasiBongkar'),
    droneJenis: gv('efDroneJenis'), operatorShift: gv('efOperatorShift'), jenisKet: gv('efJenisKet'),
    catatan: gv('efCatatan')
  };
  let createdCount = 0, updatedCount = 0;
  dates.forEach(d=>{
    // Cegah dobel: kalau di tanggal itu sudah ada catatan untuk No Unit + Sopir yang sama, gabung/timpa saja
    const idx = ENTRIES.findIndex(x=>x.date===d && x.btId===btId && x.ownerType===ownerType && (ownerType==='saya' || x.partnerId===partnerId));
    if(idx>=0){ ENTRIES[idx] = {...ENTRIES[idx], ...base, date:d}; updatedCount++; }
    else { ENTRIES.push({id:uid(), date:d, ...base}); createdCount++; }
  });
  saveEntries(); closeModal();
  let msg;
  if(createdCount && updatedCount) msg = `${createdCount} catatan baru dibuat, ${updatedCount} digabung ke yang sudah ada`;
  else if(updatedCount) msg = `${updatedCount} catatan digabung/diperbarui (sudah ada sebelumnya)`;
  else msg = dates.length>1 ? `Catatan disimpan untuk ${dates.length} hari` : 'Catatan disimpan';
  toast(msg);
  renderProgram(); renderHari(); renderRekap();
}

      <img src="${PETA_IMAGE}" id="petaImgEl" onclick="handlePetaTap(event)">

    </div>
    <div id="petaSelWrap"></div>
  `;

function handlePetaUpload(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      // kompres/perkecil dulu supaya hemat penyimpanan
      const maxW = 1400;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      PETA_IMAGE = canvas.toDataURL('image/jpeg', 0.82);
      savePetaImage();
      PETA_PINS = []; savePetaPins();
      toast('Gambar peta disimpan');
      renderPeta();
    };
    img.onerror = ()=>toast('Gagal membaca gambar');
    img.src = reader.result;
  };
  reader.onerror = ()=>toast('Gagal membaca file');
  reader.readAsDataURL(file);
}
function handlePetaTap(ev){
  const rect = ev.target.getBoundingClientRect();
  const xPct = ((ev.clientX - rect.left) / rect.width * 100).toFixed(2);
  const yPct = ((ev.clientY - rect.top) / rect.height * 100).toFixed(2);
  showPrompt('Nama lokasi/blok di titik ini?', '', function(label){
    if(!label || !label.trim()) return;
    const pin = {id:uid(), xPct, yPct, label:label.trim()};
    PETA_PINS.push(pin); savePetaPins();
    if(!BLOK_LIST.some(b=>b.label===pin.label)){ BLOK_LIST.push({id:uid(), label:pin.label, source:'peta'}); saveBlok(); refreshBlokDatalist(); }
    toast('Titik lokasi ditambahkan'); renderPeta();
  });
}
function selectPetaPin(id){
  const p = PETA_PINS.find(x=>x.id===id); if(!p) return;
  document.getElementById('petaSelWrap').innerHTML = `
    <div class="peta-selected">📍 ${p.label}
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn-sm primary" onclick="applyPetaPinToRute('${p.id}')">Isi ke Rute Hari Ini</button>

function applyPetaPinToRute(id){
  const p = PETA_PINS.find(x=>x.id===id); if(!p) return;
  showScreen('hari');
  setTimeout(()=>quickSaveField('jenisKet', p.label), 30);

function removePetaPin(id){
  showConfirm('Hapus titik lokasi ini dari peta?', function(){

function currentHmForBt(btId){

function jenisDetailText(e){
  const kat = e.jenisKategori || '-';
  switch(kat){
    case 'Antar/Jemput Tenaga':
      return kat+' - '+(e.antarTipe||'-')+' - '+(e.antarKegiatan||'-');
    case 'Muat Tebu':
      if(e.muatTipe==='Produksi') return kat+' - Produksi - '+(e.tonaseKg||'-')+' kg';
      if(e.muatTipe==='Bibit') return kat+' - Bibit - '+(e.lokasiMuat||'-')+' -> '+(e.lokasiBongkar||'-');
      return kat+' - -';
    case 'Drone':
      return kat+' - '+(e.droneJenis||'-');
    case 'Operator':
      return kat+' - '+(e.operatorShift||'-');
    case 'Lainnya':
      return kat+' - '+(e.jenisKet||'-');
    default:
      return kat;
  }
}
function sanitizePdfText(s){
  return String(s)
    .replace(/→/g, '->')
    .replace(/—/g, '-')
    .replace(/–/g, '-')
    .replace(/[’‘]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/•/g, '-');
}
function getExportRows(){
  const cols = EXPORT_COLS.filter(c=>document.getElementById('exp-'+c.key).checked);
  const allPeriod = document.getElementById('exp-allperiod').checked;
  const selectedSopir = Array.from(document.querySelectorAll('.exp-sopir-chk:checked')).map(el=>el.value);
  let filtered = allPeriod ? ENTRIES.slice() : ENTRIES.filter(e=>monthKey(e.date)===rekapMonth);
  if(selectedSopir.length>0){
    filtered = filtered.filter(e=>selectedSopir.includes(e.ownerName));
  }
  filtered.sort((a,b)=>a.date.localeCompare(b.date));
  const rows = filtered.map(e=>{
    const ot = computeOT(e); const o={};
    cols.forEach(c=>{
      if(c.key==='date') o[c.label]=fmtLabel(e.date);
      if(c.key==='btId') o[c.label]=btLabel(e.btId);
      if(c.key==='sopir') o[c.label]=e.ownerName||'-';
      if(c.key==='hm') o[c.label]=(e.hmAwal||'-')+' -> '+(e.hmAkhir||'-')+' ('+hmPakai(e)+' jam)';
      if(c.key==='bbm') o[c.label]=(e.bbmLiter||0)+' L';
      if(c.key==='jenis') o[c.label]=jenisDetailText(e);
      if(c.key==='ot') o[c.label]=fmtHoursNum(ot.otMin)+' jam';
      if(c.key==='catatan') o[c.label]=e.catatan||'-';
    });
    return o;
  });
  return {cols, rows};
}
async function saveOrShareBlob(blob, filename, mimeType){
  // 1) Coba Web Share API dengan file (paling andal di PWA mobile termasuk iOS)
  try{
    const file = new File([blob], filename, {type: mimeType});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: filename});
      return 'shared';
    }
  }catch(err){
    // Kalau user membatalkan share, jangan anggap gagal total, lanjut ke fallback
  }
  // 2) Coba unduh langsung lewat <a download>
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return 'downloaded';
  }catch(err){
    // 3) Fallback terakhir: buka file di tab baru supaya user bisa simpan/share manual
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    return 'opened';
  }
}
async function doExport(fmt){
  const {cols, rows} = getExportRows();
  if(rows.length===0){ toast('Tidak ada data yang cocok dengan filter'); return; }
  const headers = cols.map(c=>c.label);
  if(fmt==='csv'){
    try{
      let csv = headers.join(';')+'\n';
      rows.forEach(r=>{ csv += headers.map(h=>'"'+String(r[h]).replace(/"/g,'""')+'"').join(';')+'\n'; });
      const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
      const result = await saveOrShareBlob(blob, 'rekap-'+rekapMonth+'.csv', 'text/csv');
      toast(result==='shared' ? 'CSV siap dibagikan' : 'Excel (CSV) diunduh');
      closeModal();
    }catch(err){
      toast('Gagal membuat CSV: '+(err && err.message ? err.message : 'error tidak dikenal'));
    }
    return;
  }
  if(!window.jspdf){
    toast('Library PDF belum siap, coba lagi sebentar (memuat dari internet)...');
    return;
  }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFont('helvetica', 'normal');
    const pageWidth = doc.internal.pageSize.getWidth();
    const marginX = 14;
    const usableWidth = pageWidth - marginX*2;
    doc.setFontSize(14);
    doc.text(sanitizePdfText('Laporan Bulanan - '+rekapMonth), marginX, 16);
    let y = 26;
    rows.forEach((r,i)=>{
      doc.setFontSize(9);
      doc.setFont('helvetica','bold');
      const headLine = sanitizePdfText((r[headers[0]]||'')+'  |  '+(headers[1]?(headers[1]+': '+r[headers[1]]):''));
      const headSplit = doc.splitTextToSize(headLine, usableWidth);
      doc.text(headSplit, marginX, y); y += headSplit.length*4.6;
      doc.setFont('helvetica','normal');
      headers.slice(2).forEach(h=>{
        const line = sanitizePdfText(h+': '+r[h]);
        const split = doc.splitTextToSize(line, usableWidth);
        doc.text(split, marginX, y); y += split.length*4.6;
      });
      y += 4;
      if(y > 280){ doc.addPage(); y=16; }
    });
    const pdfBlob = doc.output('blob');
    const result = await saveOrShareBlob(pdfBlob, 'rekap-'+rekapMonth+'.pdf', 'application/pdf');
    toast(result==='shared' ? 'PDF siap dibagikan' : 'PDF diunduh');
    closeModal();
  }catch(err){ toast('Gagal membuat PDF: '+(err && err.message ? err.message : 'error tidak dikenal')); }
}

            <div class="list-row-actions"><button class="icon-x" onclick="removeBt('${b.id}')">${icon('close',14)}</button></div></div>
        `).join('') : (PARTNERS.length===0 ? '<div class="empty-note">Belum ada partner.</div>' : PARTNERS.map(p=>`
          <div class="list-row"><div class="list-row-name" onclick="renamePartner('${p.id}')">${p.name}</div>
            <div class="list-row-actions"><button class="icon-x" onclick="removePartner('${p.id}')">${icon('close',14)}</button></div></div>
        `).join(''))}
        <div class="add-row">
          <input type="text" id="bpNewInput" placeholder="${bpTab==='bt'?'mis. BT.21':'mis. Rekan baru'}">
          <button onclick="addBtOrPartner()">+</button>
        </div>
      </div>
    </div>`;
}
function addBtOrPartner(){
  const val = document.getElementById('bpNewInput').value.trim();
  if(!val) return;
  if(bpTab==='bt') BT_CODES.push({id:uid(), label:val}); else PARTNERS.push({id:uid(), name:val});
  saveBt(); savePartners(); renderBtPartnerSheet(); toast('Ditambahkan');
}
function renameBt(id){
  const b = BT_CODES.find(x=>x.id===id);
  showPrompt('Ubah nama kode BT', b.label, function(val){
    if(val && val.trim()){ b.label = val.trim(); saveBt(); renderBtPartnerSheet(); renderHari(); toast('No Unit diperbarui'); }
  });
}
function removeBt(id){
  showConfirm('Hapus kode BT ini?', function(){
    BT_CODES = BT_CODES.filter(x=>x.id!==id); saveBt(); renderBtPartnerSheet(); toast('No Unit dihapus');
  });
}
function renamePartner(id){
  const p = PARTNERS.find(x=>x.id===id);
  showPrompt('Ubah nama partner', p.name, function(val){
    if(val && val.trim()){ p.name = val.trim(); savePartners(); renderBtPartnerSheet(); toast('Sopir diperbarui'); }
  });
}
function removePartner(id){
  showConfirm('Hapus partner ini?', function(){
    PARTNERS = PARTNERS.filter(x=>x.id!==id); savePartners(); renderBtPartnerSheet(); toast('Sopir dihapus');
  });
}

/* ============ KELOLA JENIS LAYANAN ============ */
let jenisSheetTab = 'antar';
function openJenisSheet(){ jenisSheetTab='antar'; renderJenisSheet(); }
function jenisSubListRows(list, removeFn){
  return list.map((it,i)=>`
    <div class="list-row"><div class="list-row-name">${it.value}${it.locked?' <span style="color:#b08b5a;font-size:11px;">(default)</span>':''}</div>
      <div class="list-row-actions">${it.locked?'':`<button class="icon-x" onclick="${removeFn}(${i})">${icon('close',14)}</button>`}</div></div>
  `).join('');
}
function renderJenisSheet(){
  document.getElementById('modalHost').innerHTML = `
    <div class="sheet-scrim show" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row"><h3>Kelola Jenis Layanan</h3><button class="sheet-close" onclick="closeModal()">${icon('close',18)}</button></div>
        <div class="dsub">5 kategori utama (Antar/Jemput Tenaga, Muat Tebu, Drone, Operator, Lainnya) sudah tetap dan tidak bisa diubah. Di bawah ini kamu hanya bisa mengelola sub-daftar yang bisa ditambah manual.</div>
        <div class="hist-tabs" style="display:flex;gap:8px;margin:10px 0;">
          <div class="hist-tab ${jenisSheetTab==='antar'?'active-saya':''}" onclick="jenisSheetTab='antar';renderJenisSheet()">Kegiatan Antar/Jemput</div>
          <div class="hist-tab ${jenisSheetTab==='drone'?'active-partner':''}" onclick="jenisSheetTab='drone';renderJenisSheet()">Jenis Drone</div>
        </div>
        ${jenisSheetTab==='antar' ? jenisSubListRows(KEGIATAN_ANTAR_LIST,'removeKegiatanAntarItem') : jenisSubListRows(DRONE_JENIS_LIST,'removeDroneJenisItem')}
        <div class="add-row">
          <input type="text" id="jenisNewInput" placeholder="${jenisSheetTab==='antar'?'mis. Angkut Pupuk':'mis. Fungisida'}">
          <button onclick="addJenisSubItem()">+</button>
        </div>
      </div>
    </div>`;
}
function addJenisSubItem(){
  const val = document.getElementById('jenisNewInput').value.trim();
  if(!val) return;
  if(jenisSheetTab==='antar'){ KEGIATAN_ANTAR_LIST.push({value:val,locked:false}); saveKegiatanAntar(); }
  else{ DRONE_JENIS_LIST.push({value:val,locked:false}); saveDroneJenis(); }
  renderJenisSheet(); toast('Ditambahkan');
}
function removeKegiatanAntarItem(i){
  if(KEGIATAN_ANTAR_LIST[i].locked) return;
  showConfirm('Hapus item ini?', function(){
    KEGIATAN_ANTAR_LIST.splice(i,1); saveKegiatanAntar(); renderJenisSheet(); toast('Dihapus');
  });
}
function removeDroneJenisItem(i){
  if(DRONE_JENIS_LIST[i].locked) return;
  showConfirm('Hapus item ini?', function(){
    DRONE_JENIS_LIST.splice(i,1); saveDroneJenis(); renderJenisSheet(); toast('Dihapus');
  });
}

/* ============ KELOLA BLOK/PETAK (RUTE) ============ */
let BLOK_LIST = LS.get('mrg_blok', []); // [{id,label,source:'manual'|'peta'}]
function saveBlok(){ LS.set('mrg_blok', BLOK_LIST); }
function openBlokSheet(){ renderBlokSheet(); }
function renderBlokSheet(){
  document.getElementById('modalHost').innerHTML = `
    <div class="sheet-scrim show" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row"><h3>Kelola Blok/Petak</h3><button class="sheet-close" onclick="closeModal()">${icon('close',18)}</button></div>
        <div class="dsub">Daftar ini muncul sebagai saran otomatis di kolom Keterangan/Rute. Blok bisa ditambah manual di sini, atau otomatis masuk saat kamu menandai titik baru di tab Peta.</div>
        ${BLOK_LIST.length===0 ? '<div class="empty-note">Belum ada blok/petak.</div>' : BLOK_LIST.map(b=>`
          <div class="list-row"><div class="list-row-name">${b.label} ${b.source==='peta'?'<span class="badge-mini badge-partner">Peta</span>':''}</div>
            <div class="list-row-actions"><button class="icon-x" onclick="removeBlok('${b.id}')">${icon('close',14)}</button></div></div>
        `).join('')}
        <div class="add-row">
          <input type="text" id="blokNewInput" placeholder="mis. Blok 14 → PKS">
          <button onclick="addBlokManual()">+</button>
        </div>
      </div>
    </div>`;
}
function addBlokManual(){
  const val = document.getElementById('blokNewInput').value.trim();
  if(!val) return;
  BLOK_LIST.push({id:uid(), label:val, source:'manual'}); saveBlok(); renderBlokSheet(); refreshBlokDatalist(); toast('Blok ditambahkan');
}
function removeBlok(id){
  BLOK_LIST = BLOK_LIST.filter(x=>x.id!==id); saveBlok(); renderBlokSheet(); refreshBlokDatalist(); toast('Dihapus');
}
function refreshBlokDatalist(){
  const dl = document.getElementById('blokDatalist');
  if(dl) dl.innerHTML = BLOK_LIST.map(b=>`<option value="${b.label}">`).join('');
}

/* ============ KELOLA LIBUR ============ */
function openLiburSheet(){ renderLiburSheet(); }
function renderLiburSheet(){
  const sorted = [...LIBUR].sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('modalHost').innerHTML = `
    <div class="sheet-scrim show" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row"><h3>Kelola Hari Libur</h3><button class="sheet-close" onclick="closeModal()">${icon('close',18)}</button></div>
        <div class="dsub">Tanggal libur otomatis dihitung lembur penuh</div>
        ${sorted.length===0 ? '<div class="empty-note">Belum ada tanggal libur.</div>' : sorted.map(h=>`
          <div class="list-row"><div class="list-row-name">${fmtLabel(h.date)}${h.label?' — '+h.label:''}</div>
            <div class="list-row-actions"><button class="icon-x" onclick="removeLibur('${h.date}')">${icon('close',14)}</button></div></div>
        `).join('')}
        <div class="add-row">
          <input type="date" id="liburDateInput" style="flex:1;">
          <input type="text" id="liburLabelInput" placeholder="Keterangan (opsional)" style="flex:1;">
          <button onclick="addLibur()">+</button>
        </div>
      </div>
    </div>`;
}
function addLibur(){
  const date = document.getElementById('liburDateInput').value;
  if(!date) return;
  if(LIBUR.some(h=>h.date===date)){ toast('Tanggal ini sudah ditandai libur'); return; }
  LIBUR.push({date, label:document.getElementById('liburLabelInput').value});
  saveLibur(); renderLiburSheet(); toast('Hari libur ditambahkan');
}
function removeLibur(date){
  LIBUR = LIBUR.filter(x=>x.date!==date); saveLibur(); renderLiburSheet(); toast('Ditandai bukan libur lagi');
}

/* ============ INIT ============ */
refreshBlokDatalist();
showScreen('hari');
</script>
</body>
</html>
