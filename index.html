<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C2333">
<title>Jadwal & HM Terpadu</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --primary:#A8580E; --primary-container:#FFDDB0; --on-primary-container:#3A2200;
    --secondary:#3A5B6E; --secondary-container:#D3E8F0;
    --navy:#1C2333; --navy-2:#262F45;
    --surface:#FFF8F2; --surface-container:#F4EDE3; --surface-container-high:#EDE3D3;
    --on-surface:#211A12; --on-surface-variant:#6F6357; --outline:#E4DACB;
    --danger:#B3261E; --danger-bg:#FBEAE8; --success:#3D6B3E;
    --radius-lg:20px; --radius-md:16px; --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--surface);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--on-surface);}
  button,input,select,textarea{font-family:inherit;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* TOP BAR */
  .topbar{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#fff;cursor:pointer;flex-shrink:0;}
  .icon-btn:active{background:rgba(255,255,255,0.12);}
  .topbar-title{flex:1;min-width:0;}
  .topbar-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#F2C98A;font-weight:700;}
  .topbar-title h1{margin:2px 0 0;font-size:18px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bt-chip{background:var(--primary-container);color:var(--on-primary-container);font-weight:700;font-size:13px;padding:6px 12px;border-radius:100px;flex-shrink:0;border:none;}

  /* SCREENS */
  .screen{display:none;flex:1;overflow-y:auto;padding:16px 16px 100px;}
  .screen.active{display:block;}
  .section-eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface-variant);font-weight:700;margin:20px 2px 10px;display:block;}
  .section-eyebrow:first-child{margin-top:0;}
  .section-eyebrow-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .card{background:#fff;border:1px solid var(--outline);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;}
  .card-flat{background:var(--surface-container);border:none;}
  .row-2{display:flex;gap:12px;}
  .row-2 .card{flex:1;margin-bottom:0;}
  .field-label{font-size:12px;font-weight:600;color:var(--on-surface-variant);margin-bottom:4px;}
  .field-value{font-size:20px;font-weight:700;}
  .field-sub{font-size:12px;color:var(--on-surface-variant);margin-top:2px;}
  .empty-note{text-align:center;color:var(--on-surface-variant);font-size:13px;padding:24px 12px;}

  .hero-card{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;position:relative;overflow:hidden;}
  .hero-card::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(242,169,59,.22),transparent 70%);}
  .hero-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#F2C98A;font-weight:700;}
  .hero-num{font-size:34px;font-weight:800;margin:6px 0 2px;display:flex;align-items:baseline;gap:8px;}
  .hero-num input{background:transparent;border:none;border-bottom:2px dashed rgba(242,169,59,.5);color:var(--primary-container);font-size:34px;font-weight:800;width:70px;font-family:inherit;}
  .hero-num input:focus{outline:none;border-bottom-style:solid;}
  .hero-num span{font-size:14px;font-weight:600;color:#C9CFDD;}
  .hero-sub{font-size:12.5px;color:#B6BDCE;}

  label.flabel{display:block;font-size:14.5px;font-weight:700;color:var(--on-surface-variant);margin-bottom:6px;}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
    width:100%;border:1.5px solid var(--outline);border-radius:14px;padding:14px;font-size:17px;min-height:54px;
    background:var(--surface-container);color:var(--on-surface);margin-bottom:12px;
  }
  textarea{resize:vertical;min-height:56px;}
  .grid2{display:grid;grid-template-columns:1fr;gap:10px 12px;}
  .grid2 .full{grid-column:1/-1;}
  @media (min-width:400px){ .grid2{grid-template-columns:1fr 1fr;} }

  .pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--primary-container);color:var(--on-primary-container);font-size:13px;font-weight:700;padding:9px 16px;border-radius:100px;border:none;cursor:pointer;}
  .pill-btn-lg{font-size:16px;font-weight:800;padding:17px 20px;gap:10px;}
  .btn-filled{width:100%;background:var(--primary);color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:100px;border:none;cursor:pointer;}
  .btn-outline{width:100%;background:transparent;color:var(--primary);font-size:14.5px;font-weight:700;padding:12px;border-radius:100px;border:1.5px solid var(--primary);cursor:pointer;}
  .btn-sm{font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:100px;border:1.5px solid var(--outline);background:#fff;color:var(--on-surface-variant);cursor:pointer;}
  .btn-sm.primary{border-color:transparent;background:var(--primary-container);color:var(--on-primary-container);}

  /* RIWAYAT */
  .hist-tabs{display:flex;gap:8px;margin-bottom:12px;}
  .hist-tab{flex:1;text-align:center;padding:9px;border-radius:100px;font-size:13px;font-weight:700;border:1.5px solid var(--outline);color:var(--on-surface-variant);cursor:pointer;background:#fff;}
  .hist-tab.active-saya{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent;}
  .hist-tab.active-partner{background:var(--secondary-container);color:var(--secondary);border-color:transparent;}
  .hrow{background:#fff;border:1px solid var(--outline);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden;}
  .hrow-head{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;}
  .hrow-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0;}
  .hrow-dot.partner{background:var(--secondary);}
  .hrow-main{flex:1;min-width:0;}
  .hrow-date{font-size:14px;font-weight:700;}
  .hrow-sum{font-size:12.5px;color:var(--on-surface-variant);margin-top:1px;}
  .hrow-chev{color:var(--on-surface-variant);transition:transform .2s;flex-shrink:0;}
  .hrow.open .hrow-chev{transform:rotate(180deg);}
  .hrow-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .hrow.open .hrow-body{max-height:900px;border-top:1px solid var(--outline);}
  .hrow-body-inner{padding:14px;}
  .hrow-actions{display:flex;gap:8px;margin-top:2px;}
  .btn-save{flex:1;background:var(--primary);color:#fff;border:none;border-radius:100px;padding:11px;font-weight:700;font-size:13.5px;}
  .btn-del{background:var(--danger-bg);color:var(--danger);border:none;border-radius:100px;padding:11px 16px;font-weight:700;font-size:13.5px;}

  .box-truck-table{width:100%;border-collapse:collapse;margin-top:4px;}
  .box-truck-table th,.box-truck-table td{border:1px solid var(--outline);padding:8px 10px;font-size:12.5px;text-align:left;white-space:normal;word-break:break-word;}
  .box-truck-table th{background:var(--navy);color:#fff;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;}
  .box-truck-table tr:nth-child(even) td{background:var(--surface-container);}

  /* NAV */
  .navwrap{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;z-index:50;padding:0;background:transparent;}
  .screen{padding-bottom:110px;}
  nav.tabbar{display:flex;background:var(--navy);border-radius:100px;padding:6px;gap:2px;box-shadow:0 8px 24px rgba(20,15,5,.25);}
  nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:none;background:transparent;color:#9099AD;border-radius:100px;cursor:pointer;}
  nav.tabbar button.active{background:rgba(255,255,255,.12);color:#F2C98A;}
  nav.tabbar svg{width:20px;height:20px;}
  nav.tabbar .lbl{font-size:9.5px;font-weight:700;}

  /* DRAWER */
  .scrim{position:fixed;inset:0;background:rgba(15,10,5,.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:320px;background:var(--surface);z-index:201;transform:translateX(-105%);transition:transform .25s ease;
    border-radius:0 28px 28px 0;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;overflow-y:auto;}
  .drawer.show{transform:translateX(0);}
  .drawer-profile{display:flex;align-items:center;gap:12px;padding:8px 8px 20px;}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
  .drawer-name{font-weight:700;font-size:15px;}
  .drawer-sub{font-size:12px;color:var(--on-surface-variant);}
  .drawer-group-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-variant);padding:14px 12px 6px;}
  .drawer-item{display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:100px;color:var(--on-surface);font-size:14.5px;font-weight:600;cursor:pointer;}
  .drawer-item:active{background:var(--surface-container-high);}

  /* BOTTOM SHEET (modal umum) */
  .sheet-scrim{position:fixed;inset:0;background:rgba(15,10,5,.45);z-index:210;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-scrim.show{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%);transition:transform .25s ease;max-height:86vh;overflow-y:auto;}
  .sheet-scrim.show .sheet{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--outline);border-radius:100px;margin:8px auto 14px;}
  .sheet-title-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .sheet h3{margin:0;font-size:17px;}
  .sheet .dsub{font-size:12.5px;color:var(--on-surface-variant);margin-bottom:14px;}
  .sheet-close{background:none;border:none;font-size:18px;color:var(--on-surface-variant);cursor:pointer;padding:4px;}

  .list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--outline);}
  .list-row:last-child{border-bottom:none;}
  .list-row-name{font-size:14.5px;font-weight:600;}
  .list-row-actions{display:flex;gap:6px;}
  .icon-x{width:30px;height:30px;border-radius:50%;border:none;background:var(--danger-bg);color:var(--danger);font-weight:700;cursor:pointer;}
  .icon-edit{width:30px;height:30px;border-radius:50%;border:none;background:var(--surface-container-high);color:var(--on-surface-variant);font-weight:700;cursor:pointer;}
  .add-row{display:flex;gap:8px;margin-top:10px;}
  .add-row input{margin-bottom:0;flex:1;}
  .add-row button{flex-shrink:0;background:var(--navy);color:#fff;border:none;width:44px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;}

  .chk-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--outline);}
  .chk-row input{width:19px;height:19px;accent-color:var(--primary);}
  .chk-row label{font-size:14.5px;flex:1;}
  .export-fmt{display:flex;gap:10px;margin-top:16px;}
  .fmt-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:16px;border:1.5px solid var(--outline);background:#fff;font-weight:700;font-size:13px;color:var(--on-surface);cursor:pointer;}
  .fmt-btn.pdf{border-color:var(--danger);color:var(--danger);}
  .fmt-btn.csv{border-color:var(--success);color:var(--success);}

  .placeholder-box{text-align:center;padding:60px 20px;color:var(--on-surface-variant);}
  .placeholder-box .pic{font-size:48px;margin-bottom:10px;}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:600;
    opacity:0;transition:all .25s ease;z-index:300;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .kgt-add{width:20px;height:20px;line-height:18px;border-radius:50%;border:none;background:var(--primary-container);color:var(--on-primary-container);font-weight:800;font-size:13px;cursor:pointer;padding:0;}
  .kgt-row{display:flex;gap:6px;margin-bottom:8px;}
  .kgt-row input{margin-bottom:0;flex:1;}
  .kgt-row .kgt-rm{flex-shrink:0;width:32px;border-radius:10px;border:1.5px solid var(--outline);background:#fff;color:var(--danger);font-weight:700;cursor:pointer;}
  .loc-chip{display:flex;align-items:center;gap:6px;background:var(--primary-container);color:var(--on-primary-container);border-radius:100px;padding:7px 8px 7px 12px;font-size:13px;font-weight:700;}
  .loc-chip button{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.12);color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}

  .badge-mini{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:100px;margin-left:6px;}
  .badge-saya{background:var(--primary-container);color:var(--on-primary-container);}
  .badge-partner{background:var(--secondary-container);color:var(--secondary);}
  .loc-field-btn{width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:var(--surface-variant,#efeae2);border:1.5px solid var(--outline);border-radius:14px;padding:12px 14px;font-size:14.5px;color:var(--on-surface);cursor:pointer;}
  .loc-field-btn.empty{color:var(--on-surface-variant);}
  .loc-field-btn span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lokpick-search{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--outline);font-size:14.5px;margin-bottom:10px;}
  .lokpick-list{max-height:38vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .lokpick-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface-variant,#efeae2);font-size:14.5px;font-weight:600;cursor:pointer;}
  .lokpick-item:active{opacity:.7;}
  .lokpick-actions{display:flex;gap:8px;margin-bottom:6px;}
  .lokpick-map-wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#e9e3d8;margin-bottom:10px;max-height:34vh;overflow-y:auto;}
  .lokpick-map-wrap img{width:100%;display:block;}
  .lokpick-pin{position:absolute;transform:translate(-50%,-100%);font-size:20px;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
  .peta-toprow{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .peta-toprow input[type=date]{flex:1;min-width:150px;padding:9px 10px;border-radius:12px;border:1.5px solid var(--outline);font-size:13.5px;}
  .peta-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--on-surface-variant);margin-bottom:10px;}
  .peta-selected{font-size:13px;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="icon-btn" onclick="openDrawer()">
      <svg viewBox="0 -960 960 960" width="24" height="24" fill="currentColor"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
    </button>
    <div class="topbar-title">
      <div class="topbar-eyebrow" id="topEyebrow">Hari Ini</div>
      <h1 id="topTitle">—</h1>
    </div>
    <button class="bt-chip" id="topBtChip" onclick="showScreen('hari')">—</button>
  </div>

  <!-- HARI INI -->
  <div class="screen active" id="screen-hari"></div>
  <!-- PROGRAM -->
  <div class="screen" id="screen-program"></div>
  <!-- PETA -->
  <div class="screen" id="screen-peta"></div>
  <!-- SERVIS -->
  <div class="screen" id="screen-servis"></div>
  <!-- REKAP -->
  <div class="screen" id="screen-rekap"></div>

  <div class="navwrap">
    <nav class="tabbar">
      <button data-tab="hari" onclick="showScreen('hari')">
        <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
        <span class="lbl">Hari Ini</span>
      </button>
      <button data-tab="program" onclick="showScreen('program')">
        <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Zm280 240q-17 0-28.5-11.5T440-440q0-17 11.5-28.5T480-480q17 0 28.5 11.5T520-440q0 17-11.5 28.5T480-400Zm-160 0q-17 0-28.5-11.5T280-440q0-17 11.5-28.5T320-480q17 0 28.5 11.5T360-440q0 17-11.5 28.5T320-400Zm320 0q-17 0-28.5-11.5T600-440q0-17 11.5-28.5T640-480q17 0 28.5 11.5T680-440q0 17-11.5 28.5T640-400ZM480-240q-17 0-28.5-11.5T440-280q0-17 11.5-28.5T480-320q17 0 28.5 11.5T520-280q0 17-11.5 28.5T480-240Zm-160 0q-17 0-28.5-11.5T280-280q0-17 11.5-28.5T320-320q17 0 28.5 11.5T360-280q0 17-11.5 28.5T320-240Zm320 0q-17 0-28.5-11.5T600-280q0-17 11.5-28.5T640-320q17 0 28.5 11.5T680-280q0 17-11.5 28.5T640-240Z"/></svg>
        <span class="lbl">Program</span>
      </button>
      <button data-tab="peta" onclick="showScreen('peta')">
        <svg viewBox="0 -960 960 960" fill="currentColor"><path d="m600-120-240-84-186 72q-20 8-37-4.5T120-170v-560q0-13 7.5-23t20.5-15l212-72 240 84 186-72q20-8 37 4.5t17 33.5v560q0 13-7.5 23T812-192l-212 72Zm-40-98v-468l-160-56v468l160 56Zm80 0 120-40v-474l-120 46v468Zm-440-10 120-46v-468l-120 40v474Zm440-458v468-468Zm-320-56v468-468Z"/></svg>
        <span class="lbl">Peta</span>
      </button>
      <button data-tab="servis" onclick="showScreen('servis')">
        <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M686-132 444-376q-20 8-40.5 12t-43.5 4q-100 0-170-70t-70-170q0-36 10-68.5t28-61.5l146 146 72-72-146-146q29-18 61.5-28t68.5-10q100 0 170 70t70 170q0 23-4 43.5T584-516l244 242q12 12 12 29t-12 29l-84 84q-12 12-29 12t-29-12Zm29-85 27-27-256-256q18-20 26-46.5t8-53.5q0-60-38.5-104.5T386-758l74 74q12 12 12 28t-12 28L332-500q-12 12-28 12t-28-12l-74-74q9 57 53.5 95.5T360-440q26 0 52-8t47-25l256 256ZM472-488Z"/></svg>
        <span class="lbl">Layanan</span>
      </button>
      <button data-tab="rekap" onclick="showScreen('rekap')">
        <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M640-160v-280h160v280H640Zm-240 0v-640h160v640H400Zm-240 0v-440h160v440H160Z"/></svg>
        <span class="lbl">Rekap</span>
      </button>
    </nav>
  </div>

  <div class="scrim" id="scrim" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-profile">
      <div class="avatar" id="drawerAvatar">?</div>
      <div>
        <div class="drawer-name" id="drawerName">—</div>
        <div class="drawer-sub" id="drawerSub">—</div>
      </div>

// ====== PERBAIKAN: escapeHtml ======
function escapeHtml(str) {
  if (!str) return '';
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  };
  return String(str).replace(/[&<>"']/g, function(m) { return map[m]; });
}

// ====== PERBAIKAN: IndexedDB untuk gambar peta ======
const DB_NAME = 'PetaDB';
const STORE_NAME = 'images';
const DB_VERSION = 1;
function openPetaDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (ev) => {
      const db = ev.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function savePetaImageToDB(dataUrl) {
  const db = await openPetaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.put(dataUrl, 'petaImage');
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
async function loadPetaImageFromDB() {
  const db = await openPetaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.get('petaImage');
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function enumerateDates(start, end){
  const dates = []; let cur = new Date(start+'T00:00:00'); const last = new Date((end||start)+'T00:00:00');
  if(last < cur) return [start];
  while(cur <= last){
    dates.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'));
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}

function toMinutes(t){
  if(!t) return null;
  // support time input: HH:MM
  if (t.includes(':')) {
    const parts = t.split(':');
    const h = parseInt(parts[0],10), m = parseInt(parts[1],10);
    if (!isNaN(h) && !isNaN(m) && h>=0 && h<=23 && m>=0 && m<=59) return h*60 + m;
    return null;
  }
  // fallback: numeric
  const clean = t.trim().replace(/[^0-9:.]/g,'').replace('.',':');
  let h, m;
  if(clean.includes(':')){
    const parts = clean.split(':');
    if(parts.length<2) return null;
    h = parseInt(parts[0],10); m = parseInt(parts[1],10);
  } else if(clean.length===3 || clean.length===4){
    const padded = clean.padStart(4,'0');
    h = parseInt(padded.slice(0,2),10); m = parseInt(padded.slice(2,4),10);
  } else if(clean.length<=2){
    h = parseInt(clean,10); m = 0;
  } else {
    return null;
  }
  if(isNaN(h)||isNaN(m)||h>23||m>59) return null;
  return h*60+m;
}

function computeOT(e){
  const isFullOt = dow(e.date)===0 || isHoliday(e.date);
  const t1 = toMinutes(e.s1Time), t5 = toMinutes(e.s5Time);
  let span = (t1!==null && t5!==null) ? Math.max(0, t5-t1) : 0;
  const rs = toMinutes(e.istMulai), re = toMinutes(e.istSelesai);
  let restMin = (rs!==null && re!==null) ? Math.max(0, re-rs) : 0;
  if(e.istLembur) restMin = 0;
  const totalMin = Math.max(0, span-restMin);
  const normalMin = isFullOt ? 0 : (NORMAL_HOURS[dow(e.date)]||0)*60;
  let otMin = isFullOt ? totalMin : Math.max(0, totalMin-normalMin);
  if(e.otOverride !== null && e.otOverride !== undefined && e.otOverride !== '') otMin = Number(e.otOverride)*60;
  return {totalMin, otMin, isFullOt};
}

// ====== PERBAIKAN: penggabungan duplikat (mergeDuplicateEntries) ======
function mergeDuplicateEntries() {
  const groups = {};
  const order = [];
  ENTRIES.forEach(e => {
    const key = e.date + '|' + e.ownerType + '|' + (e.ownerName || '');
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(e);
  });
  let mergedCount = 0;
  const result = [];
  order.forEach(key => {
    const list = groups[key];
    if (list.length === 1) { result.push(list[0]); return; }
    mergedCount += list.length - 1;
    const base = Object.assign({}, list[0]);
    const scalarKeys = ['btId', 's1Time', 's5Time', 'istMulai', 'istSelesai', 'istLembur', 'otOverride', 'hmAwal', 'hmAkhir', 'bbmLiter', 'jenisKategori', 'antarTipe', 'antarKegiatan', 'muatTipe', 'tonaseKg', 'lokasiMuat', 'lokasiBongkar', 'droneJenis', 'operatorShift'];
    scalarKeys.forEach(k => {
      for (let i = 0; i < list.length; i++) {
        if (list[i][k] !== undefined && list[i][k] !== null && list[i][k] !== '') {
          base[k] = list[i][k];
          break;
        }
      }
    });
    // Gabungkan catatan dan jenisKet dengan unik
    ['catatan', 'jenisKet'].forEach(k => {
      const vals = list.map(e => e[k]).filter(v => v && v.trim());
      if (vals.length) {
        const unique = [...new Set(vals.map(v => v.trim()))];
        base[k] = unique.join('\n');
      } else {
        base[k] = '';
      }
    });
    ['kegiatanPagi', 'kegiatanSore'].forEach(k => {
      const seen = [];
      list.forEach(e => {
        let arr = e[k];
        if (typeof arr === 'string') arr = arr ? [arr] : [];
        (arr || []).forEach(v => { if (v && !seen.includes(v)) seen.push(v); });
      });
      base[k] = seen.length ? seen : [''];
    });
    result.push(base);
  });
  if (mergedCount > 0) { ENTRIES = result; saveEntries(); }
  return mergedCount;
}

function normKegiatan(e){
  ['kegiatanPagi','kegiatanSore'].forEach(k=>{
    if(typeof e[k]==='string'){ e[k] = e[k] ? [e[k]] : ['']; }
    if(!Array.isArray(e[k]) || e[k].length===0) e[k]=[''];
  });
  return e;
}

function quickSaveField(key, val) {
  const e = getTodayEntry();
  // Validasi
  if (['hmAwal', 'hmAkhir', 'bbmLiter', 'tonaseKg', 'otOverride'].includes(key)) {
    try {
      const num = validateNumberInput(val, true);
      if (num !== null) val = String(num);
    } catch (err) {
      toast(err.message);
      return;
    }
  }
  if (['s1Time', 's5Time', 'istMulai', 'istSelesai'].includes(key)) {
    try {
      val = validateTimeInput(val);
    } catch (err) {
      toast(err.message);
      return;
    }
  }
  e[key] = val;
  // Cek apakah sudah ada di ENTRIES
  const exists = ENTRIES.find(x => x.id === e.id);
  if (!exists) { ENTRIES.push(e); }
  saveEntries();
  renderHari();
}

function calcOtPreviewMin(dateStr, s1, s5){
  if(!dateStr) return 0;
  const isFullOt = dow(dateStr)===0 || isHoliday(dateStr);
  const t1 = toMinutes(s1), t5 = toMinutes(s5);
  let span = (t1!==null && t5!==null) ? Math.max(0, t5-t1) : 0;
  let restMin = isFullOt ? 0 : 150;
  const totalMin = Math.max(0, span-restMin);
  const normalMin = isFullOt ? 0 : (NORMAL_HOURS[dow(dateStr)]||0)*60;
  return isFullOt ? totalMin : Math.max(0, totalMin-normalMin);
}
function updateProgramOtPreview(){
  if(window._efOtManual) return;
  const dateEl = document.getElementById('efDate'), s1El = document.getElementById('efS1'), s5El = document.getElementById('efS5');
  if(!dateEl || !s1El || !s5El) return;
  const otMin = calcOtPreviewMin(dateEl.value, s1El.value, s5El.value);
  const otField = document.getElementById('efOt');
  if(otField) otField.value = otMin>0 ? fmtHoursNum(otMin) : '';

function saveEntryForm(id){
  const sopirVal = document.getElementById('efSopir').value;
  const partnerObj = PARTNERS.find(p=>p.id===sopirVal);
  const ownerType = sopirVal==='saya' ? 'saya' : 'partner';
  const partnerId = ownerType==='partner' ? sopirVal : '';
  const dateStart = document.getElementById('efDate').value;
  const dateEnd = document.getElementById('efDateEnd').value || dateStart;
  const dates = enumerateDates(dateStart, dateEnd);
  const btId = document.getElementById('efBt').value;
  const jenisKategori = document.getElementById('efJenisKategori').value;
  const gv = elId => document.getElementById(elId) ? document.getElementById(elId).value : '';
  const base = {
    btId, ownerType, partnerId,
    ownerName: ownerType==='saya' ? (USER.name||'Saya') : (partnerObj?partnerObj.name:'Sopir'),
    s1Time: gv('efS1'), s5Time: gv('efS5'),
    istMulai:'11.00', istSelesai:'13.30', istLembur:false,
    otOverride: gv('efOt')===''?null:gv('efOt'),
    hmAwal:'', hmAkhir:'', bbmLiter:'',
    jenisKategori,
    antarTipe: gv('efAntarTipe'), antarKegiatan: gv('efAntarKegiatan'),
    muatTipe: gv('efMuatTipe'), tonaseKg: gv('efTonase'),
    lokasiMuat: gv('efLokasiMuat'), lokasiBongkar: gv('efLokasiBongkar'),
    droneJenis: gv('efDroneJenis'), operatorShift: gv('efOperatorShift'), jenisKet: gv('efJenisKet'),
    catatan: gv('efCatatan')
  };
  let createdCount = 0, updatedCount = 0;
  dates.forEach(d=>{
    const idx = ENTRIES.findIndex(x=>x.date===d && x.btId===btId && x.ownerType===ownerType && (ownerType==='saya' || x.partnerId===partnerId));
    if(idx>=0){ ENTRIES[idx] = {...ENTRIES[idx], ...base, date:d}; updatedCount++; }
    else { ENTRIES.push({id:uid(), date:d, ...base}); createdCount++; }
  });
  saveEntries(); closeModal();
  let msg;
  if(createdCount && updatedCount) msg = `${createdCount} catatan baru dibuat, ${updatedCount} digabung ke yang sudah ada`;
  else if(updatedCount) msg = `${updatedCount} catatan digabung/diperbarui (sudah ada sebelumnya)`;
  else msg = dates.length>1 ? `Catatan disimpan untuk ${dates.length} hari` : 'Catatan disimpan';
  toast(msg);
  renderProgram(); renderHari(); renderRekap();
}
function deleteEntry(id){
  showConfirm('Hapus catatan ini?', function(){
    ENTRIES = ENTRIES.filter(x=>x.id!==id); saveEntries(); toast('Catatan dihapus'); renderProgram(); renderRekap();
  });
}

let PETA_PINS = LS.get('mrg_peta_pins', []);
function savePetaPins(){ LS.set('mrg_peta_pins', PETA_PINS); }
let petaZoom = 100;
let petaSelectedDate = todayIso();

function petaColorMapForDate(dateIso){
  const map = {};
  function mark(label, color){
    if(!label) return;
    if(!map[label]) map[label] = color;
    else if(map[label] !== color) map[label] = 'orange';
  }
  ENTRIES.filter(e=>e.date===dateIso && e.ownerType==='saya').forEach(e=>{
    if(e.jenisKategori==='Muat Tebu' && e.muatTipe==='Bibit'){
      mark(e.lokasiMuat, 'green');
      mark(e.lokasiBongkar, 'red');
    } else if(LOKASI_RUTE_KATEGORI.includes(e.jenisKategori)){
      mark(e.lokasiMuat, 'green');
    }
  });
  return map;
}
function petaPinEmoji(color){
  return color==='green' ? '🟢' : color==='red' ? '🔴' : color==='orange' ? '🟠' : '📍';
}
function petaDateChange(val){
  petaSelectedDate = val || todayIso();
  renderPeta();
}
function petaGoToday(){
  petaSelectedDate = todayIso();
  renderPeta();
}

// Async karena menggunakan IndexedDB
async function renderPeta(){
  const host = document.getElementById('screen-peta');
  const imageData = await loadPetaImageFromDB();
  if(!imageData){
    host.innerHTML = `
      <div class="section-eyebrow">Peta Kebun</div>
      <label class="peta-upload" for="petaFileInput">${icon('photo_camera',18)} Pilih Gambar Peta dari HP
        <input type="file" id="petaFileInput" accept="image/*" onchange="handlePetaUpload(event)">
      </label>
      <div class="empty-note">Belum ada gambar peta. Pilih foto/scan peta kebun dari galeri HP-mu — tersimpan permanen di aplikasi, bisa dipakai tanpa internet.</div>

    return;
  }
  const colorMap = petaColorMapForDate(petaSelectedDate);
  const isToday = petaSelectedDate === todayIso();
  host.innerHTML = `
    <div class="section-eyebrow section-eyebrow-row">Peta Kebun
      <button class="btn-sm" onclick="document.getElementById('petaFileInput2').click()">${icon('sync',14)} Ganti Gambar</button>
    </div>

    <div class="peta-toprow">
      <input type="date" value="${petaSelectedDate}" onchange="petaDateChange(this.value)">
      ${!isToday ? `<button class="btn-sm" onclick="petaGoToday()">Hari Ini</button>` : ''}
    </div>
    <div class="peta-zoom-bar">
      <div class="peta-zoom-btn" onclick="petaZoomBy(-25)">−</div>
      <div class="peta-zoom-label">${petaZoom}%</div>
      <div class="peta-zoom-btn" onclick="petaZoomBy(25)">+</div>
    </div>
    <div class="peta-scrollbox" id="petaScrollbox">
      <div class="peta-imgwrap" id="petaImgWrap" style="width:${petaZoom}%;">
        <img src="${imageData}" id="petaImgEl" onclick="handlePetaTap(event)">
        ${PETA_PINS.map(p=>`<div class="peta-pin" style="left:${p.xPct}%;top:${p.yPct}%;" title="${escapeHtml(p.label)}" onclick="event.stopPropagation();selectPetaPin('${p.id}')">${petaPinEmoji(colorMap[p.label])}</div>`).join('')}
      </div>
    </div>
    <div class="peta-legend" style="margin-top:10px;">🟢 Lokasi utama / Muat &nbsp; 🔴 Lokasi Bongkar &nbsp; 🟠 Dipakai sebagai keduanya</div>
    <div class="dsub" style="margin:4px 0 8px;">Ketuk di atas peta untuk menandai lokasi baru. Ketuk pin yang sudah ada untuk mengisinya ke Hari Ini atau melihat riwayat. Warna pin mengikuti tanggal yang dipilih.</div>
    <div id="petaSelWrap"></div>
  `;
}
function petaZoomBy(delta){
  const box = document.getElementById('petaScrollbox');
  const prevScrollX = box?box.scrollLeft:0, prevScrollY = box?box.scrollTop:0;
  const prevZoom = petaZoom;
  petaZoom = Math.max(100, Math.min(600, petaZoom + delta));
  renderPeta();
  const newBox = document.getElementById('petaScrollbox');
  if(newBox && prevZoom>0){
    const ratio = petaZoom/prevZoom;
    newBox.scrollLeft = prevScrollX*ratio;
    newBox.scrollTop = prevScrollY*ratio;
  }
}
async function handlePetaUpload(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const img = new Image();
    img.onload = async () => {
      const maxW = 1400;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      await savePetaImageToDB(dataUrl);
      PETA_PINS = []; savePetaPins();
      toast('Gambar peta disimpan');
      renderPeta();
    };
    img.onerror = () => toast('Gagal membaca gambar');
    img.src = reader.result;
  };
  reader.onerror = () => toast('Gagal membaca file');
  reader.readAsDataURL(file);
}
let _pendingPetaTap = null;
const KODE_DIVISI_LIST = ['TS','BS','BU','TU'];
function handlePetaTap(ev){
  const rect = ev.target.getBoundingClientRect();
  const xPct = ((ev.clientX - rect.left) / rect.width * 100).toFixed(2);
  const yPct = ((ev.clientY - rect.top) / rect.height * 100).toFixed(2);
  _pendingPetaTap = {xPct, yPct};
  openPetakLabelSheet();
}
function openPetakLabelSheet(){
  const recent = BLOK_LIST.slice(-10).reverse();
  document.getElementById('modalHost').innerHTML = `

        <div class="grid2">
          <div><label class="flabel">Nomor Blok</label><input type="text" inputmode="numeric" id="petakBlokInput" placeholder="mis. 11" autofocus></div>
          <div><label class="flabel">Kode Divisi</label><select id="petakKodeInput">${KODE_DIVISI_LIST.map(k=>`<option value="${k}">${k}</option>`).join('')}</select></div>

function fillPetakFromRecent(label){
  const parts = label.trim().split(/\s+/);
  if(parts.length>=3){
    document.getElementById('petakBlokInput').value = parts[0];
    document.getElementById('petakKodeInput').value = KODE_DIVISI_LIST.includes(parts[1]) ? parts[1] : KODE_DIVISI_LIST[0];

function confirmPetaTapLabel(){
  const blok = document.getElementById('petakBlokInput').value.trim();
  const kode = document.getElementById('petakKodeInput').value;
  const petak = document.getElementById('petakNomorInput').value.trim();
  if(!blok || !petak){ toast('Isi dulu nomor blok dan petaknya'); return; }

  const val = blok+' '+kode+' '+petak;
  const pin = {id:uid(), xPct:_pendingPetaTap.xPct, yPct:_pendingPetaTap.yPct, label:val};

  if(!BLOK_LIST.some(b=>b.label===pin.label)){ BLOK_LIST.push({id:uid(), label:pin.label, source:'peta'}); saveBlok(); refreshBlokDatalist(); }

  closeModal();
  toast('Titik lokasi ditambahkan');
  renderPeta();

function selectPetaPin(id){
  const p = PETA_PINS.find(x=>x.id===id); if(!p) return;
  let infoHtml = '';
  if(petaSelectedDate !== todayIso()){
    const matches = ENTRIES.filter(e=>e.date===petaSelectedDate && e.ownerType==='saya' &&

    if(matches.length){

        const isBibit = e.jenisKategori==='Muat Tebu' && e.muatTipe==='Bibit';
        const peran = isBibit ? (e.lokasiBongkar===p.label ? 'Lokasi Bongkar' : 'Lokasi Muat') : 'Lokasi';
        return `${escapeHtml(btLabel(e.btId))} · ${escapeHtml(e.jenisKategori)}${isBibit?' - Bibit':''} · ${peran}`;
      }).join('<br>') + '</div>';
    } else {
      infoHtml = '<div class="peta-selected" style="margin-top:6px;">Tidak dipakai di tanggal ini.</div>';

  document.getElementById('petaSelWrap').innerHTML = `

function applyPetaPinToField(field, label){

function lastServisForBt(btId){
  const list = SERVIS.filter(s=>s.btId===btId).sort((a,b)=>b.date.localeCompare(a.date));
  return list[0] || null;
}
function currentHmForBt(btId){
  const vals = ENTRIES.filter(e=>e.btId===btId && e.hmAkhir!=='' && e.hmAkhir!=null).map(e=>parseFloat(e.hmAkhir)).filter(v=>!isNaN(v));
  return vals.length ? Math.max(...vals) : null;
}
function hmServiceStatus(btId){
  const last = lastServisForBt(btId);
  const current = currentHmForBt(btId);
  const baseHm = last ? parseFloat(last.hm)||0 : null;
  const sisa = (baseHm!==null && current!==null) ? Math.max(0, current-baseHm) : null;
  return {last, current, baseHm, sisa};
}
function sopirOtSummary(monthEntries){
  const map = {};
  monthEntries.forEach(e=>{
    const key = resolveOwnerName(e);
    const ot = computeOT(e).otMin/60;
    map[key] = (map[key]||0) + ot;
  });
  return Object.entries(map).map(([name,jam])=>({name,jam})).filter(x=>x.jam>0).sort((a,b)=>b.jam-a.jam);
}
function sopirOtBarsHtml(list){
  if(!list.length) return `<div class="empty-note">Belum ada data lembur bulan ini.</div>`;
  const max = Math.max(...list.map(x=>x.jam), 0.1);
  return list.map((x,i)=>`
    <div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px;"><span>${i===0?'🏆 ':''}${escapeHtml(x.name)}</span><span>${x.jam.toFixed(1)} jam</span></div>
      <div style="background:var(--surface-container-high);border-radius:100px;height:10px;overflow:hidden;">
        <div style="height:100%;border-radius:100px;width:${Math.max(4,(x.jam/max)*100)}%;background:${i===0?'var(--danger)':'var(--primary)'};"></div>
      </div>
    </div>`).join('');
}
function renderRekap(){

  const ratio = totalHm>0 ? (totalBbm/totalHm).toFixed(2) : '0.00';

  host.innerHTML = `
    <div class="section-eyebrow">Ringkasan</div>
    <input type="month" value="${rekapMonth}" style="width:auto;margin:0 0 10px;padding:8px 12px;font-size:13.5px;min-height:auto;" onchange="rekapMonth=this.value;renderRekap()">
    <div class="row-2" style="margin-bottom:12px;">
      <div class="card"><div class="field-label">Total HM</div><div class="field-value">${totalHm.toFixed(1)}</div></div>
      <div class="card"><div class="field-label">Total BBM</div><div class="field-value">${totalBbm.toFixed(0)} L</div></div>
    </div>
    <div class="row-2" style="margin-bottom:12px;">
      <div class="card"><div class="field-label">Rasio L/HM</div><div class="field-value" style="font-size:17px;">${ratio}</div></div>
      <div class="card"><div class="field-label">Total Lembur</div><div class="field-value" style="font-size:17px;">${totalOt.toFixed(1)}j</div></div>
    </div>

    <div class="section-eyebrow">Filter BT Saya — ${escapeHtml(btLabel(mainBt))}</div>
    <div class="card">
      <div class="row-2" style="margin-bottom:2px;">
        <div><div class="field-label">BBM bulan ini (${escapeHtml(btLabel(mainBt))})</div><div class="field-value" style="font-size:19px;">${mainBtBbmMonth.toFixed(0)} L</div></div>
        <div><div class="field-label">HM Sekarang</div><div class="field-value" style="font-size:19px;">${svc.current!==null?svc.current.toFixed(1):'—'}</div></div>
      </div>
    </div>
    <div class="card" style="${overdue?'border-color:var(--danger);':nearing?'border-color:var(--primary);':''}">
      <div class="field-label">Progres Menuju Servis Berkala (${intervalHm} jam HM)</div>
      ${svc.baseHm===null ? `<div class="field-sub" style="margin-top:6px;">Belum ada catatan servis untuk ${escapeHtml(btLabel(mainBt))}. Tambahkan servis terakhir agar progres bisa dihitung.</div>` : `
        <div style="background:var(--surface-container-high);border-radius:100px;height:10px;margin:10px 0 6px;overflow:hidden;">
          <div style="height:100%;border-radius:100px;width:${pct}%;background:${overdue?'var(--danger)':'var(--primary)'};"></div>
        </div>
        <div class="field-sub">${svc.sisa.toFixed(1)} jam terpakai sejak servis terakhir (${escapeHtml(fmtLabel(svc.last.date))}, HM ${svc.baseHm})${overdue?' — sudah melewati batas, segera servis!':nearing?' — sudah mendekati batas servis':''}</div>
      `}
      <button class="btn-outline" style="margin-top:12px;" onclick="openServisForm('${mainBt}', ${svc.current!==null?svc.current:'null'})">${icon('build',16)} Catat Servis Berkala (Reset)</button>
    </div>

    <div class="section-eyebrow">Overtime per Sopir (bulan ini)</div>

      ${sopirOtBarsHtml(sopirOt)}

      <div class="hist-tab ${histFilter==='saya'?'active-saya':''}" onclick="setHistFilter('saya')">🟠 Saya</div>
      <div class="hist-tab ${histFilter==='partner'?'active-partner':''}" onclick="setHistFilter('partner')">🔵 Sopir</div>

function resolveOwnerName(e){
  if(e.ownerType === 'saya') return USER.name || 'Saya';
  return e.ownerName || 'Sopir';
}
function allSopirNames(){
  const names = new Set();
  names.add(USER.name||'Saya');
  PARTNERS.forEach(p=>names.add(p.name));
  ENTRIES.forEach(e=>{ names.add(resolveOwnerName(e)); });
  return Array.from(names);
}

function jenisDetailText(e){
  const kat = e.jenisKategori || '-';
  const rute = e.lokasiMuat || '-';
  switch(kat){
    case 'Antar/Jemput Tenaga':
      return kat+' - '+(e.antarTipe||'-')+' - '+(e.antarKegiatan||'-')+' - '+rute;
    case 'Muat Tebu':
      if(e.muatTipe==='Produksi') return kat+' - Produksi - '+rute;
      if(e.muatTipe==='Bibit') return kat+' - Bibit - '+(e.lokasiMuat||'-')+' + '+(e.lokasiBongkar||'-');
      return kat+' - -';
    case 'Drone':
      return kat+' - '+(e.droneJenis||'-')+' - '+rute;
    case 'Operator':
      return kat+' - '+(e.operatorShift||'-');
    case 'Lainnya':
      return kat+' - '+(e.jenisKet||'-');
    default:
      return kat;
  }
}
function sanitizePdfText(s){
  return String(s)
    .replace(/→/g, '->')
    .replace(/—/g, '-')
    .replace(/–/g, '-')
    .replace(/[’‘]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/•/g, '-');
}
function getExportRows(){
  const cols = EXPORT_COLS.filter(c=>document.getElementById('exp-'+c.key).checked);
  const mode = document.querySelector('input[name="exp-mode"]:checked').value;
  const selectedSopir = Array.from(document.querySelectorAll('.exp-sopir-chk:checked')).map(el=>el.value);
  let filtered;
  if(mode==='all'){
    filtered = ENTRIES.slice();
  } else if(mode==='custom'){
    const from = document.getElementById('exp-dateFrom').value;
    const to = document.getElementById('exp-dateTo').value;
    filtered = ENTRIES.filter(e => (!from || e.date >= from) && (!to || e.date <= to));
  } else {
    filtered = ENTRIES.filter(e=>monthKey(e.date)===rekapMonth);
  }
  if(selectedSopir.length>0){
    filtered = filtered.filter(e=>selectedSopir.includes(resolveOwnerName(e)));
  }
  filtered.sort((a,b)=>a.date.localeCompare(b.date));
  const rows = filtered.map(e=>{
    const ot = computeOT(e); const o={};
    cols.forEach(c=>{
      if(c.key==='date') o[c.label]=fmtLabel(e.date);
      if(c.key==='btId') o[c.label]=btLabel(e.btId);
      if(c.key==='sopir') o[c.label]=resolveOwnerName(e);
      if(c.key==='hm') o[c.label]=(e.hmAwal||'-')+' -> '+(e.hmAkhir||'-')+' ('+hmPakai(e)+' jam)';
      if(c.key==='bbm') o[c.label]=(e.bbmLiter||0)+' L';
      if(c.key==='jenis') o[c.label]=jenisDetailText(e);
      if(c.key==='ot') o[c.label]=fmtHoursNum(ot.otMin)+' jam';
      if(c.key==='catatan') o[c.label]=e.catatan||'-';
    });
    return o;
  });
  return {cols, rows};
}
function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
function isNativeApp(){
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
}
async function saveOrShareBlob(blob, filename, mimeType){
  if(isNativeApp() && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem){
    try{
      const { Filesystem } = window.Capacitor.Plugins;
      const base64 = await blobToBase64(blob);
      const written = await Filesystem.writeFile({
        path: filename,
        data: base64,
        directory: 'CACHE',
        recursive: true
      });
      if(window.Capacitor.Plugins.Share){
        await window.Capacitor.Plugins.Share.share({ title: filename, url: written.uri, dialogTitle: 'Simpan atau bagikan file' });
        return 'shared';
      }
      return 'saved-native';
    }catch(err){
      const msg = err && err.message ? err.message : JSON.stringify(err);
      if(/cancel/i.test(msg)){
        return 'canceled';
      }
      alert('Gagal simpan native: ' + msg);
      return 'failed';
    }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return 'downloaded';
  }catch(err){
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    return 'opened';
  }
}
function exportFileLabel(){
  const mode = document.querySelector('input[name="exp-mode"]:checked').value;
  if(mode==='all') return 'semua-periode';
  if(mode==='custom'){
    const from = document.getElementById('exp-dateFrom').value || 'awal';
    const to = document.getElementById('exp-dateTo').value || 'akhir';
    return from+'_sd_'+to;
  }
  return rekapMonth;
}
async function doExport(fmt){
  try {
    const {cols, rows} = getExportRows();
    if(rows.length===0){ toast('Tidak ada data yang cocok dengan filter'); return; }
    const headers = cols.map(c=>c.label);
    if(fmt==='xlsx'){
      if(!window.XLSX){
        toast('Library Excel belum siap, coba lagi sebentar...');
        return;
      }
      const sheetData = [headers, ...rows.map(r=>headers.map(h=>r[h]))];
      const ws = XLSX.utils.aoa_to_sheet(sheetData);
      ws['!cols'] = headers.map(h=>({ wch: Math.min(Math.max(h.length, 12), 40) }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Rekap');
      const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      const blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const result = await saveOrShareBlob(blob, 'rekap-'+exportFileLabel()+'.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      toast(result==='saved-native' ? 'Excel tersimpan di Documents' : (result==='shared' ? 'Excel siap dibagikan' : 'Excel (.xlsx) diunduh'));
      closeModal();
      return;
    }
    if(!window.jspdf){
      toast('Library PDF belum siap, coba lagi sebentar (memuat dari internet)...');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: headers.length>5 ? 'landscape' : 'portrait' });
    doc.setFont('helvetica', 'normal');
    const marginX = 10;
    doc.setFontSize(14);
    doc.text(sanitizePdfText('Laporan - '+exportFileLabel()), marginX, 14);
    if(typeof doc.autoTable === 'function'){
      doc.autoTable({
        head: [headers.map(h=>sanitizePdfText(h))],
        body: rows.map(r=>headers.map(h=>sanitizePdfText(String(r[h]==null?'-':r[h])))),
        startY: 20,
        margin: {left: marginX, right: marginX},
        styles: {fontSize: 8, cellPadding: 2, font: 'helvetica'},
        headStyles: {fillColor: [28,35,51]},
        theme: 'grid'
      });
    } else {
      // Fallback kalau library tabel gagal dimuat: susun sebagai teks bertumpuk
      let y = 26;
      const pageWidth = doc.internal.pageSize.getWidth();
      const usableWidth = pageWidth - marginX*2;
      rows.forEach(r=>{
        doc.setFontSize(9);
        headers.forEach(h=>{
          const line = sanitizePdfText(h+': '+r[h]);
          const split = doc.splitTextToSize(line, usableWidth);
          doc.text(split, marginX, y); y += split.length*4.6;
        });
        y += 4;
        if(y > 280){ doc.addPage(); y=16; }
      });
    }
    const pdfBlob = doc.output('blob');
    const result = await saveOrShareBlob(pdfBlob, 'rekap-'+exportFileLabel()+'.pdf', 'application/pdf');
    toast(result==='saved-native' ? 'PDF tersimpan di Documents' : (result==='shared' ? 'PDF siap dibagikan' : 'PDF diunduh'));
    closeModal();
  } catch(err) {
    toast('Gagal export: ' + (err.message || 'error tidak diketahui'));
  }
}

  document.getElementById('modalHost').innerHTML = `

function addJenisSubItem(){

function removeKegiatanAntarItem(i){
